<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e55b4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="건률 포켓몬">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>건률네 포켓몬 대시보드</title>
<meta name="description" content="건률이의 하루 루틴과 포켓몬 도감을 한 화면에 담은 우리 가족 대시보드">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* ============ 건률네 포켓몬 대시보드 — 스타일 ============ */
:root{
  --dex-red:#e8483c;
  --dex-red-dark:#b82a22;
  --dex-red-darker:#8f1e18;
  --cream:#fdf4e6;
  --ink:#2b2b33;
  --ink-soft:#5d5a66;
  --card:#fffdf8;
  --paper:#ffffff;
  --blue:#3aa0ff;
  --yellow:#ffd23f;
  --green:#3fae64;
  --green-soft:#e3f6e8;
  --pink:#ff8fb1;
  --violet:#9b7bff;
  --shadow:0 6px 0 #ded0bb;
  --radius:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,sans-serif;
  background-color:var(--cream);
  background-image:radial-gradient(circle at 1px 1px, rgba(190,160,125,.30) 1px, transparent 0);
  background-size:22px 22px;
  color:var(--ink);
  min-height:100vh;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}

.app{max-width:1560px;margin:0 auto;padding:14px 16px 60px}

/* ---------- 상단 포켓덱스 헤더 ---------- */
.dex-header{
  position:relative;
  border:4px solid var(--ink);
  border-radius:26px;
  padding:14px 18px 16px;
  color:#fff;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0 2px, transparent 2px 33px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 2px, transparent 2px 33px),
    linear-gradient(165deg,#f4695f 0%,#e5433a 45%,#cf2f28 100%);
  box-shadow:0 8px 0 var(--dex-red-darker), 0 18px 34px rgba(120,40,30,.18);
  overflow:hidden;
}
.dex-header::after{
  content:'';
  position:absolute;inset:auto -40px -60px auto;
  width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%, rgba(255,255,255,.18), transparent 65%);
  pointer-events:none;
}
.dex-lights{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.light{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);box-shadow:inset -1px -2px 0 rgba(0,0,0,.25)}
.light.blue{background:radial-gradient(circle at 35% 30%,#b9e3ff,#2f8fe0)}
.light.red{background:radial-gradient(circle at 35% 30%,#ff9a9a,#d22a20);width:14px;height:14px}
.light.yellow{background:radial-gradient(circle at 35% 30%,#fff3b0,#f7c422);width:14px;height:14px}
.light.green{background:radial-gradient(circle at 35% 30%,#c8f5cd,#3fae64);width:14px;height:14px}
.light-line{flex:1;height:4px;border-radius:4px;background:rgba(43,43,51,.35);margin-left:6px}

.dex-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.pokeball-logo{
  width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);flex:none;
  background:linear-gradient(to bottom,#f4625a 0 45%,var(--ink) 45% 55%,#fff 55% 100%);
  position:relative;box-shadow:0 3px 0 rgba(0,0,0,.22);
}
.pokeball-logo::after{
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--ink);
}
.brand-text{min-width:0}
.dex-header h1{
  font-size:clamp(20px,2.5vw,30px);line-height:1.15;letter-spacing:-.5px;
  text-shadow:0 2px 0 rgba(0,0,0,.28);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand-sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px;font-size:14px;opacity:.96}
.brand-sub .dot-sep{opacity:.55}
#liveClock{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.5px}
.now-temp{background:rgba(43,43,51,.35);border:2px solid rgba(43,43,51,.5);padding:1px 9px;border-radius:20px}

.quick-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qbtn{
  display:inline-flex;align-items:center;gap:7px;
  min-height:50px;padding:0 15px;
  border-radius:16px;border:3px solid var(--ink);
  background:#fffdf8;color:var(--ink);
  font-size:16px;font-weight:700;
  box-shadow:0 4px 0 rgba(43,43,51,.55);
  transition:transform .06s ease, filter .15s ease;
}
.qbtn:hover{filter:brightness(1.04)}
.qbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,43,51,.55)}
.qbtn.on{background:var(--yellow)}
.qbtn.gacha{background:linear-gradient(170deg,#fff6d8,#ffe087)}
.qbtn .ball-mini{
  width:22px;height:22px;border-radius:50%;border:2.5px solid var(--ink);flex:none;
  background:linear-gradient(to bottom,#f4625a 0 45%,var(--ink) 45% 55%,#fff 55% 100%);
}
.qbtn .chip{
  display:inline-block;min-width:26px;text-align:center;
  background:var(--dex-red);color:#fff;border:2.5px solid var(--ink);
  border-radius:12px;padding:1px 7px;font-size:15px;
}

/* ---------- 날씨 ---------- */
.weather-strip{
  display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding:2px 2px 4px;
  scrollbar-width:none;
}
.weather-strip::-webkit-scrollbar{display:none}
.wx{
  flex:1 1 0;min-width:104px;
  background:rgba(255,255,255,.16);
  border:2.5px solid rgba(43,43,51,.45);
  border-radius:16px;padding:8px 6px;text-align:center;color:#fff;
  backdrop-filter:blur(2px);
}
.wx.today{background:rgba(255,255,255,.92);color:var(--ink);border-color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.wx .day{font-size:13px;font-weight:700;opacity:.92}
.wx .emo{font-size:26px;line-height:1.15;margin:1px 0}
.wx .tmp{font-size:15px;font-weight:700;white-space:nowrap}
.wx .tmp .lo{opacity:.72;font-weight:400}
.wx .pop{font-size:12px;opacity:.9}
.wx-state{font-size:14px;opacity:.92;padding:8px 4px}

/* ---------- 보드 ---------- */
.board{display:grid;grid-template-columns:minmax(360px,450px) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:1060px){
  .board{grid-template-columns:1fr}
  .task-col{order:1}
  .cal-col{order:2}
}
.task-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.cal-col{min-width:0}

.card{
  background:var(--card);
  border:3.5px solid var(--ink);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px 16px 16px;
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;margin-bottom:10px;flex-wrap:wrap}
.card-title{font-size:19px;display:flex;align-items:center;gap:8px;white-space:nowrap}

/* ---------- 가족 캘린더 ---------- */
.cal-nav{display:flex;align-items:center;gap:5px;margin-left:auto}
.mini-btn{
  width:40px;height:40px;border-radius:12px;border:2.5px solid var(--ink);
  background:#fff;font-size:18px;font-weight:700;display:grid;place-items:center;
  box-shadow:0 3px 0 rgba(43,43,51,.3);flex:none;
}
.mini-btn:active{transform:translateY(2px);box-shadow:none}
.mini-btn.today-btn{width:auto;padding:0 10px;font-size:15px;white-space:nowrap}
.cal-month{font-size:17.5px;font-weight:700;min-width:104px;text-align:center;white-space:nowrap}

.cal-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fchip{
  border:2.5px solid var(--ink);background:#fff;border-radius:20px;
  padding:5px 11px;font-size:14px;font-weight:700;opacity:.62;
  box-shadow:0 2px 0 rgba(43,43,51,.22);
}
.fchip.active{opacity:1}
.fchip[data-m="all"].active{background:#fff5cf}
.fchip[data-m="geonryul"].active{background:#ffd9c9}
.fchip[data-m="mom"].active{background:#ffe0ee}
.fchip[data-m="dad"].active{background:#d6e8ff}
.fchip[data-m="family"].active{background:#d8f3dd}

.cal-grid-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-grid-head div{text-align:center;font-size:13px;font-weight:700;color:var(--ink-soft);padding:2px 0}
.cal-grid-head div.sun{color:#e0453b}
.cal-grid-head div.sat{color:#2f7fd6}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cday{
  position:relative;border:2.5px solid transparent;background:transparent;border-radius:12px;
  min-height:52px;padding:3px 2px 0;display:flex;flex-direction:column;align-items:center;
  font-size:16px;font-weight:700;transition:background .12s ease;
}
.cday:hover{background:#f7ecdc}
.cday.other{opacity:.32}
.cday.sun{color:#e0453b}
.cday.sat{color:#2f7fd6}
.cday.today{border-color:var(--dex-red);background:#fff0ea;color:var(--dex-red)}
.cday.selected{background:var(--ink);color:#fff;border-color:var(--ink)}
.cday.selected .evdot{background:#fff !important}
.cdots{display:flex;gap:2px;margin-top:auto;padding-bottom:4px;height:9px;align-items:center}
.evdot{width:6px;height:6px;border-radius:50%;background:var(--ink)}

.day-panel{margin-top:12px;border-top:2.5px dashed #e0cfb7;padding-top:12px}
.day-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.day-title strong{font-size:16.5px}
.add-ev{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.add-ev input[type=text]{
  flex:1 1 130px;min-width:0;height:44px;border:2.5px solid var(--ink);border-radius:12px;
  padding:0 10px;font-size:15px;background:#fff;
}
.add-ev select{
  height:44px;border:2.5px solid var(--ink);border-radius:12px;padding:0 6px;
  font-size:14px;background:#fff;font-weight:700;
}
.add-ev button{
  height:44px;padding:0 14px;border-radius:12px;border:2.5px solid var(--ink);
  background:var(--yellow);font-weight:700;font-size:15px;box-shadow:0 3px 0 rgba(43,43,51,.3);
}
.add-ev button:active{transform:translateY(2px);box-shadow:none}
.ev-list{display:flex;flex-direction:column;gap:6px}
.ev-item{
  display:flex;align-items:center;gap:8px;background:#fff;border:2.5px solid var(--ink);
  border-radius:12px;padding:7px 9px;font-size:15px;
}
.ev-item .evbar{width:7px;align-self:stretch;border-radius:6px;flex:none}
.ev-item .evtxt{flex:1;min-width:0;word-break:break-all}
.ev-item .evwho{font-size:12.5px;font-weight:700;padding:2px 7px;border-radius:10px;border:2px solid rgba(43,43,51,.35);white-space:nowrap}
.ev-del{
  border:none;background:#ffe6e3;border-radius:9px;width:32px;height:32px;font-size:15px;flex:none;
  border:2px solid rgba(43,43,51,.25);
}
.ev-item .evwho-sel{
  font-size:12.5px;font-weight:700;padding:3px 4px;border-radius:10px;flex:none;
  border:2px solid rgba(43,43,51,.35);background:#fff;max-width:104px;cursor:pointer;
}
.ev-sync{
  font-size:11.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap;
  border:2px dashed rgba(43,43,51,.3);border-radius:10px;padding:1px 6px;
}
.empty-note{font-size:14px;color:var(--ink-soft);padding:6px 2px}

/* ---------- 일정 일괄 관리 ---------- */
.evm-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.evm-count{font-size:13.5px;font-weight:700;color:var(--ink-soft)}
.evm-check-all{display:inline-flex;align-items:center;gap:7px;font-size:14.5px;font-weight:700;cursor:pointer}
.evm-check-all input{width:22px;height:22px;accent-color:var(--dex-red);cursor:pointer}
.evm-list{
  display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow-y:auto;
  padding:8px 4px;border-top:2px dashed #e0cfb7;border-bottom:2px dashed #e0cfb7;margin-bottom:10px;
}
.evm-row{
  display:flex;align-items:center;gap:8px;background:#fff;border:2.5px solid var(--ink);
  border-radius:12px;padding:7px 9px;font-size:14.5px;cursor:pointer;
}
.evm-row.synced{background:#f6f3ec;border-style:dashed;opacity:.9;cursor:default}
.evm-row input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--dex-red);cursor:pointer}
.evm-row input[type=checkbox]:disabled{cursor:default}
.evm-cdot{width:9px;height:26px;border-radius:5px;flex:none}
.evm-date{font-size:13px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.evm-title{flex:1;min-width:0;word-break:break-all}
.evm-member{font-size:12.5px;font-weight:700;padding:2px 7px;border-radius:10px;border:2px solid rgba(43,43,51,.35);white-space:nowrap}
.evm-sync{
  font-size:11.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap;
  border:2px dashed rgba(43,43,51,.3);border-radius:10px;padding:1px 6px;
}
.evm-sync-wrap{margin-bottom:10px}
.evm-sync-head{font-size:13.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.evm-list-sync{max-height:20vh;border-color:#ddd0b8}
.evm-hint{font-size:12.5px;color:var(--ink-soft);margin-top:5px}
.evm-empty{padding:14px 4px;text-align:center;color:var(--ink-soft);font-size:14.5px;line-height:1.5}
.evm-actions{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  background:#fff8e6;border:2.5px dashed #e0b96a;border-radius:14px;padding:9px 10px;
}
.evm-move{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.evm-lbl{font-size:13.5px;font-weight:700;color:var(--ink-soft)}
.evm-move select{height:40px;border:2.5px solid var(--ink);border-radius:11px;padding:0 6px;font-size:14px;font-weight:700;background:#fff;max-width:130px}
@media (max-width:600px){
  .evm-row{font-size:13.5px;gap:6px;padding:6px 7px}
  .evm-date{font-size:12px}
  .evm-member{font-size:11.5px;padding:1px 5px}
  .evm-actions{justify-content:center}
}

/* ---------- 파트너 카드 ---------- */
.partner-card{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 84% 16%, #fff4bf 0 42px, transparent 43px),
    linear-gradient(175deg,#bfe9ff 0%,#d9f2ff 52%,#eaf9ff 53%,#f2fbf4 100%);
  padding:14px 16px 14px;
}
.partner-card::before{
  content:'';position:absolute;left:0;right:0;bottom:0;height:34%;
  background:linear-gradient(180deg,#cfeeae,#b7e493);opacity:.65;
  border-top:3px dashed rgba(43,43,51,.12);
}
.partner-top{position:relative;display:flex;gap:14px;align-items:center;flex:1 1 460px;min-width:0}
.partner-hero{position:relative;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.partner-side{position:relative;flex:1 1 300px;max-width:370px;margin-left:auto;display:flex;flex-direction:column;gap:10px;justify-content:center}
.partner-sprite-wrap{
  position:relative;flex:none;width:132px;height:132px;display:grid;place-items:center;
  background:rgba(255,255,255,.55);border:3px solid var(--ink);border-radius:24px;
  box-shadow:0 4px 0 rgba(43,43,51,.18);
}
.partner-sprite{width:112px;height:112px;image-rendering:pixelated;filter:drop-shadow(0 6px 3px rgba(0,0,0,.18));animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lv-badge{
  position:absolute;left:-8px;top:-10px;background:var(--yellow);border:3px solid var(--ink);
  border-radius:12px;padding:2px 8px;font-size:15px;font-weight:700;box-shadow:0 3px 0 rgba(43,43,51,.35);
}
.partner-info{position:relative;flex:1;min-width:0;max-width:620px}
.partner-name-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.partner-name{font-size:27px;letter-spacing:-.5px}
.partner-no{font-size:14px;font-weight:700;color:var(--ink-soft)}
.partner-genus{font-size:13.5px;color:var(--ink-soft);margin-top:1px}
.type-badges{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tbadge{
  font-size:13px;font-weight:700;color:#fff;border:2.5px solid var(--ink);
  border-radius:10px;padding:1px 8px;text-shadow:0 1px 2px rgba(0,0,0,.3);
}
.xp-wrap{margin-top:9px}
.xp-label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:3px}
.xp-bar{height:16px;border:3px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden;position:relative}
.xp-fill{height:100%;width:0%;background:linear-gradient(90deg,#8ee06a,#3fae64);transition:width .45s cubic-bezier(.2,.9,.2,1)}
.evo-dots{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.evo-dots .dot{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--ink);background:#fff}
.evo-dots .dot.on{background:var(--yellow)}
.evo-dots .lnk{width:14px;height:3px;background:rgba(43,43,51,.35);border-radius:3px}
.partner-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;position:relative;margin-top:0}
.pstat{
  background:#fffdf8;border:2.5px solid var(--ink);border-radius:14px;
  padding:5px 10px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px;
  box-shadow:0 3px 0 rgba(43,43,51,.16);
}
.partner-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:0;position:relative}
.partner-actions .pbtn:first-of-type{grid-column:1 / -1}
@media (max-width:1180px){
  .partner-side{max-width:none;margin-left:0;flex:1 1 100%}
  .partner-actions{grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
  .partner-actions .pbtn:first-of-type{grid-column:auto}
  .partner-stats{grid-template-columns:repeat(4,minmax(0,1fr))}
}
.pbtn{
  border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:700;font-size:15px;
  padding:9px 13px;min-height:46px;box-shadow:0 4px 0 rgba(43,43,51,.3);
}
.pbtn:active{transform:translateY(3px);box-shadow:none}
.pbtn.primary{background:var(--blue);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.pbtn.evolve{
  background:linear-gradient(170deg,#fff1a8,#ffd23f);
  animation:pulse 1.1s ease-in-out infinite;
}
#specialEvo{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
#specialEvo.hide{display:none}
#specialEvo .pbtn.evolve{
  background:linear-gradient(170deg,#f3e2ff,#c79cf2);
  animation:pulse 1.4s ease-in-out infinite;
}
#specialEvo .pbtn.locked{
  animation:none;filter:grayscale(.45);opacity:.9;box-shadow:0 3px 0 rgba(43,43,51,.2);
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.partner-loading{font-size:14px;color:var(--ink-soft)}

/* ---------- 오늘의 할 일 ---------- */
.tasks-card{padding:14px 16px 18px}
.tasks-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.tasks-title{font-size:21px;display:flex;align-items:center;gap:8px}
.tasks-sub{font-size:14px;color:var(--ink-soft);margin-top:2px}
.today-ring{
  display:grid;place-items:center;width:66px;height:66px;border-radius:50%;
  background:conic-gradient(var(--green) calc(var(--p,0) * 1%), #eee7da 0);
  border:3px solid var(--ink);flex:none;position:relative;
}
.today-ring span{
  width:52px;height:52px;border-radius:50%;background:#fffdf8;display:grid;place-items:center;
  font-size:15px;font-weight:700;line-height:1;text-align:center;
}
.sections{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.section{
  border:3px solid var(--ink);border-radius:18px;background:#fff;
  padding:10px 11px 11px;box-shadow:0 4px 0 rgba(43,43,51,.14);
}
.section.weekend{background:linear-gradient(180deg,#fff8e2,#fffdf7)}
.section.weekend.hot{background:linear-gradient(180deg,#fff0c9,#fffbe9);border-color:#e0912c;box-shadow:0 4px 0 rgba(224,145,44,.35)}
.section.done{background:linear-gradient(180deg,#edf9ef,#fffdf7)}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec-emoji{font-size:23px;line-height:1}
.sec-name{font-size:18px;flex:1;min-width:0}
.sec-name small{font-size:12.5px;font-weight:400;color:var(--ink-soft);margin-left:6px}
.sec-count{
  font-size:14px;font-weight:700;background:#f1e8da;border:2.5px solid var(--ink);
  border-radius:12px;padding:1px 8px;white-space:nowrap;
}
.section.done .sec-count{background:var(--green);color:#fff}
.sec-badge{font-size:16px}
.sec-progress{height:9px;background:#f0e7d9;border-radius:8px;overflow:hidden;border:2px solid rgba(43,43,51,.18);margin-bottom:8px}
.sec-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8ee06a,#3fae64);transition:width .35s ease}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.task{
  display:flex;align-items:center;gap:10px;text-align:left;
  border:3px solid var(--ink);border-radius:15px;background:#fffdf8;
  padding:9px 11px;min-height:64px;font-size:16.5px;font-weight:700;
  box-shadow:0 4px 0 rgba(43,43,51,.16);
  transition:transform .07s ease, background .15s ease;
  user-select:none;
}
.task:hover{background:#fff}
.task:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,43,51,.16)}
.task .temoji{font-size:24px;flex:none;line-height:1}
.task .ttext{flex:1;min-width:0;word-break:keep-all;line-height:1.24}
.task .tcheck{
  width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);flex:none;
  background:#fff;display:grid;place-items:center;font-size:18px;color:#fff;transition:background .15s ease;
}
.task.done{background:var(--green-soft);border-color:#2f8a4e}
.task.done .ttext{text-decoration:line-through;text-decoration-thickness:2px;opacity:.62}
.task.done .tcheck{background:var(--green);border-color:#2f8a4e}
.task.reward-pop{animation:pop .38s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.task-empty{font-size:14px;color:var(--ink-soft)}
.tasks-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--ink-soft);flex-wrap:wrap}

/* ===============================================================
   한 화면 압축 레이아웃 (태블릿·PC 768px 이상)
   헤더·날씨·파트너 카드를 납작하게 만들고, 할 일 섹션을 2열로 놓아
   스크롤 없이 오늘 할 일을 다 볼 수 있게 합니다.
   =============================================================== */
@media (min-width:768px){
  /* --- 상단 헤더 --- */
  .app{padding:10px 14px 40px}
  .dex-header{padding:8px 14px 9px;border-radius:22px;box-shadow:0 6px 0 var(--dex-red-darker),0 12px 24px rgba(120,40,30,.16)}
  .dex-lights{margin-bottom:5px;gap:6px}
  .light{width:13px;height:13px;border-width:2.5px}
  .light.red,.light.yellow,.light.green{width:10px;height:10px}
  .light-line{height:3px}
  .dex-top{gap:8px}
  .brand{gap:9px}
  .pokeball-logo{width:34px;height:34px;border-width:2.5px}
  .pokeball-logo::after{width:9px;height:9px;border-width:2.5px}
  .dex-header h1{font-size:clamp(17px,1.85vw,23px)}
  .brand-sub{margin-top:0;font-size:12.5px;gap:6px}
  .now-temp{padding:0 7px;font-size:12px;border-width:1.5px}
  .quick-actions{gap:6px}
  .qbtn{min-height:36px;padding:0 11px;font-size:13.5px;border-width:2.5px;border-radius:11px;gap:5px;box-shadow:0 3px 0 rgba(43,43,51,.5)}
  .qbtn .ball-mini{width:15px;height:15px;border-width:2px}
  .qbtn .chip{font-size:12px;min-width:19px;padding:0 5px;border-width:2px;border-radius:8px}

  /* --- 날씨 : 한 줄 슬림 칩 --- */
  .weather-strip{margin-top:6px;gap:6px;padding:0;flex-wrap:nowrap;overflow-x:auto}
  .wx{
    display:flex;align-items:center;gap:5px;flex:0 0 auto;min-width:0;
    padding:3px 9px;border-radius:11px;border-width:2px;background:rgba(255,255,255,.18);
  }
  .wx.today{box-shadow:none;padding:3px 10px}
  .wx .day{font-size:12px;white-space:nowrap}
  .wx .emo{font-size:14px;margin:0;line-height:1}
  .wx .tmp{font-size:12.5px}
  .wx .pop{font-size:11px;opacity:.85;white-space:nowrap}
  .wx-state{font-size:12px;padding:2px}

  /* --- 보드 --- */
  .board{gap:12px;margin-top:10px}
  .task-col{gap:10px}
  .card{padding:10px 12px 12px;border-radius:18px}
  .cal-col .card{padding:9px 10px 10px}
  .cal-col .card-title{font-size:17px}
  .cday{min-height:38px;font-size:14.5px}
  .cal-month{font-size:15.5px;min-width:92px}
  .mini-btn{width:34px;height:34px;border-radius:10px;font-size:16px}
  .mini-btn.today-btn{font-size:13.5px;padding:0 8px}
  .cal-filters{gap:4px;margin-bottom:7px}
  .fchip{padding:2px 8px;font-size:12.5px;border-width:2.5px}
  .day-panel{margin-top:7px;padding-top:7px}
  .day-title strong{font-size:15px}
  .day-title .btn.sm{font-size:12px;min-height:32px;padding:4px 8px}
  .ev-item{font-size:14px;padding:6px 8px;border-width:2px}
  .add-ev input[type=text],.add-ev select,.add-ev button{height:38px;font-size:13.5px}
  .ics-note,.empty-note{font-size:12.5px}

  /* --- 파트너 카드 : 한 줄 납작하게 --- */
  .partner-card{padding:8px 12px}
  .partner-card::before{height:22%}
  .partner-hero{gap:10px;flex-wrap:wrap;align-items:center}
  .partner-top{gap:10px;flex:0 1 auto;align-items:center}
  .partner-sprite-wrap{width:76px;height:76px;border-radius:15px;border-width:2.5px}
  .partner-sprite{width:72px;height:72px}
  .lv-badge{font-size:11.5px;padding:0 6px;border-width:2.5px;border-radius:8px;left:-6px;top:-8px;box-shadow:0 2px 0 rgba(43,43,51,.35)}
  .partner-info{max-width:none}
  .partner-name{font-size:18.5px;letter-spacing:-.3px}
  .partner-no{font-size:11px}
  .partner-genus{display:none}
  .type-badges{margin-top:1px;gap:4px}
  .tbadge{font-size:10.5px;padding:0 6px;border-width:2px;border-radius:7px}
  .xp-wrap{margin-top:4px}
  .xp-label{font-size:10.5px;margin-bottom:2px}
  .xp-bar{height:9px;border-width:2px;border-radius:7px}
  .evo-dots{margin-top:3px;font-size:10.5px;gap:4px}
  .evo-dots .dot{width:9px;height:9px;border-width:2px}
  .evo-dots .lnk{width:10px;height:2px}
  .partner-side{flex:0 0 auto;max-width:none;margin-left:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;justify-content:flex-end}
  .partner-stats{grid-template-columns:repeat(4,minmax(0,auto));gap:6px}
  .pstat{font-size:12px;padding:2px 7px;border-width:2px;border-radius:9px;box-shadow:0 2px 0 rgba(43,43,51,.16);gap:3px}
  .partner-actions{display:flex;flex-wrap:wrap;gap:6px}
  .partner-actions .pbtn{min-height:32px;padding:0 9px;font-size:12px;border-width:2.5px;border-radius:9px;box-shadow:0 2px 0 rgba(43,43,51,.3);grid-column:auto}
  #specialEvo{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px}
  #specialEvo .pbtn{flex:1 1 46%}

  /* --- 오늘의 할 일 : 섹션 2열 --- */
  .tasks-card{padding:9px 12px 10px}
  .tasks-head{margin-bottom:2px;align-items:center;gap:8px}
  .tasks-head > div{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
  .tasks-title{font-size:18px;gap:6px;display:inline-flex}
  .tasks-sub{font-size:11.5px;margin-top:0}
  .today-ring{width:50px;height:50px;border-width:2.5px}
  .today-ring span{width:40px;height:40px;font-size:12.5px}
  body:not(.focus-mode) .sections{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;margin-top:8px;align-items:start;
  }
  .section{padding:6px 8px 7px;border-width:2.5px;border-radius:14px;box-shadow:0 3px 0 rgba(43,43,51,.14)}
  .sec-head{gap:6px;margin-bottom:5px}
  .sec-emoji{font-size:20px}
  .sec-name{font-size:16.5px}
  .sec-name small{font-size:11.5px;margin-left:4px}
  .sec-count{font-size:13px;padding:1px 7px;border-width:2px;border-radius:9px}
  .sec-badge{font-size:13px}
  .sec-progress{height:6px;border-width:1.5px;margin-bottom:6px}
  .tasks{grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px}
  .task{min-height:56px;padding:8px 11px;font-size:16.5px;gap:9px;border-width:2.5px;border-radius:13px;box-shadow:0 3px 0 rgba(43,43,51,.18)}
  .task .temoji{font-size:21px}
  .task .tcheck{width:31px;height:31px;font-size:16px;border-width:2.5px}
  .task .tspeak{width:29px;height:29px;font-size:13.5px;border-width:2.2px}
  .task-empty{font-size:13px}
  .tasks-foot{margin-top:8px;font-size:12px}
}

/* 화면 높이가 낮은 태블릿(800px 안팎)은 스크롤 없이 한 화면에 들어오도록 한 단계 더 압축 */
@media (min-width:768px) and (max-height:860px){
  .dex-header{padding:6px 12px 7px}
  .dex-lights{margin-bottom:3px}
  .dex-header h1{font-size:clamp(16px,1.7vw,21px)}
  .qbtn{min-height:33px}
  .weather-strip{margin-top:5px}
  .board{margin-top:8px;gap:10px}
  .partner-card{padding:6px 12px}
  .partner-sprite-wrap{width:68px;height:68px}
  .partner-sprite{width:64px;height:64px}
  .tasks-sub{display:none}
  .tasks-card{padding:8px 12px 9px}
  .today-ring{width:46px;height:46px}
  .today-ring span{width:36px;height:36px;font-size:12px}
  .sections{margin-top:7px;gap:8px}
  .sec-head{margin-bottom:4px}
  .sec-progress{margin-bottom:5px}
  .task{min-height:52px;font-size:16px;padding:6px 10px}
  .task .tcheck{width:29px;height:29px}
  .task .temoji{font-size:20px}
  .tasks-foot{margin-top:6px;font-size:11.5px}
  .cal-col .card{padding:8px 9px 9px}
  .cday{min-height:36px}
}

/* 달력과 할 일을 나란히 두는 넓은 화면 — 달력은 작게, 할 일은 넓게 */
@media (min-width:1061px){
  .board{grid-template-columns:minmax(260px,320px) minmax(0,1fr)}
}

/* 넓은 화면에서는 태블릿 세로처럼 할 일이 더 크게 보이도록 */
@media (min-width:1360px){
  .task{min-height:58px;font-size:17px}
  .task .tcheck{width:33px;height:33px}
  .task .temoji{font-size:22px}
}

/* ---------- 집중 모드 ---------- */
body.focus-mode .cal-col,
body.focus-mode .weather-strip,
body.focus-mode .brand-sub .wx-inline,
body.focus-mode .tasks-sub,
body.focus-mode .sec-name small{display:none}
body.focus-mode .board{grid-template-columns:1fr}
body.focus-mode .dex-header{padding:10px 14px}
body.focus-mode .dex-header h1{font-size:22px}
body.focus-mode .partner-top{gap:10px;flex:1 1 100%}
body.focus-mode .partner-info{max-width:none}
body.focus-mode .partner-side{display:none}
body.focus-mode .partner-card{padding:10px 14px}
body.focus-mode .partner-sprite-wrap{width:96px;height:96px;border-radius:18px}
body.focus-mode .partner-sprite{width:80px;height:80px}
body.focus-mode .partner-name{font-size:23px}
body.focus-mode .partner-genus,
body.focus-mode .partner-stats{display:none}
body.focus-mode .task{min-height:84px;font-size:22px;padding:12px 14px}
body.focus-mode .task .temoji{font-size:30px}
body.focus-mode .task .tcheck{width:42px;height:42px;font-size:22px}
body.focus-mode .task .tspeak{width:40px;height:40px;font-size:19px;border-width:3px}
body.focus-mode .praise-banner{font-size:21px;padding:12px 22px}
body.focus-mode .tasks{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
body.focus-mode .sec-name{font-size:22px}
.focus-exit{
  position:fixed;right:14px;bottom:14px;z-index:60;
  min-height:56px;padding:0 20px;border-radius:18px;border:3.5px solid var(--ink);
  background:var(--yellow);font-size:17px;font-weight:700;box-shadow:0 6px 0 rgba(43,43,51,.45);
  display:none;
}
body.focus-mode .focus-exit{display:block}
.focus-exit:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(43,43,51,.45)}

/* ---------- 📖 영어사전 ---------- */
.qbtn.dict{background:linear-gradient(170deg,#eaf7ff,#bfe4ff);border-color:#134a72;color:#0f3f61;box-shadow:0 4px 0 #7fb3d6}
@media (min-width:768px){.qbtn.dict{box-shadow:0 3px 0 #7fb3d6}}

.dict-wrap{display:flex;flex-direction:column;gap:9px}
.dict-topline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dict-search{display:flex;gap:8px;align-items:center;flex:1 1 240px;min-width:0}
.dict-search input{
  flex:1;min-width:0;height:52px;border:3px solid var(--ink);border-radius:16px;
  padding:0 14px;font-size:19px;background:#fff;outline:none;
}
.dict-search input:focus{box-shadow:0 0 0 4px rgba(58,160,255,.28)}
.dict-search .dict-clear{width:52px;height:52px;flex:none;border:3px solid var(--ink);border-radius:16px;background:#fff;font-size:20px;font-weight:700}
.dict-dice{height:52px;flex:none;padding:0 15px;border:3px solid var(--ink);border-radius:16px;

.dict-dice:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,43,51,.4)}
.dict-cats{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 5px;scrollbar-width:none}

.dchip{flex:0 0 auto;padding:8px 13px;border:2.5px solid var(--ink);border-radius:999px;background:#fffdf8;

.dchip.active{background:var(--yellow)}
.dict-status{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--ink-soft)}

.dw .dbest{font-size:12px;color:#a96600;font-weight:700;margin-left:auto;flex:none}
.dict-online-card{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:8px;padding:12px 14px;
  border:3px solid #134a72;border-radius:16px;background:linear-gradient(170deg,#eaf7ff,#c9e9ff);

.dict-hero .dhmain{min-width:0}
.dict-word{font-size:38px;line-height:1.02;letter-spacing:-.6px;word-break:break-word}
.dict-phon{font-size:16px;color:#6b5f52;margin-top:3px}
.dict-ko{font-size:21px;font-weight:700;color:var(--dex-red-dark);margin-top:2px}
.dict-best{font-size:13px;color:#8a6a00;margin-top:4px;font-weight:700}
.dict-say{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.dsay{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;padding:6px 8px;
  border:3px solid var(--ink);border-radius:16px;background:#fffdf8;font-size:16.5px;font-weight:700;
  box-shadow:0 4px 0 rgba(43,43,51,.22)}
.dsay small{font-size:12px;font-weight:400;color:var(--ink-soft)}
.dsay:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,43,51,.22)}
.dsay.usa{background:linear-gradient(170deg,#e8f1ff,#cfe2ff)}
.dsay.uk{background:linear-gradient(170deg,#ffeef1,#ffd9e1)}
.dsay.slow{background:linear-gradient(170deg,#eefae6,#d6f0c6)}
.dsay.native{background:linear-gradient(170deg,#fff7e0,#ffe9a8)}
.dict-ex{margin-top:10px;padding:10px 13px;border:3px dashed #cdb99b;border-radius:16px;background:#fff}
.dict-ex .dex{font-size:19px;line-height:1.35}
.dict-ex .dek{font-size:14.5px;color:var(--ink-soft);margin-top:3px}
.dict-ex .exsay{margin-top:8px;min-height:42px;padding:0 12px;border:2.5px solid var(--ink);border-radius:12px;
  background:#f4f8ff;font-size:15px;font-weight:700}
.dict-practice{margin-top:12px}
.dict-mic{width:100%;min-height:66px;border:3.5px solid var(--ink);border-radius:20px;font-size:21px;font-weight:700;color:#fff;
  background:linear-gradient(170deg,#ff8f80,#e2493c);box-shadow:0 5px 0 #8f1e18}
.dict-mic:active{transform:translateY(3px);box-shadow:0 2px 0 #8f1e18}
.dict-mic.stop{background:linear-gradient(170deg,#7d8bff,#4c5bd6);box-shadow:0 5px 0 #2c357f}
.dict-note{margin-top:10px;padding:11px 13px;border-radius:15px;font-size:15px;line-height:1.5}
.dict-note.info{background:#eef6ff;border:2.5px solid #9cc4e8}
.dict-note.warn{background:#fff2e6;border:2.5px solid #e8ad74}
.dict-note.good{background:#eaf9ec;border:2.5px solid #8ecb9b}
.dict-listen{display:flex;align-items:center;gap:11px;margin-top:10px;padding:12px 14px;
  border:2.5px solid #2b7bb9;border-radius:16px;background:#e8f7ff;font-size:17px;font-weight:700;color:#134a72}
.dict-pulse{width:20px;height:20px;border-radius:50%;background:#e8483c;flex:none;animation:dictPulse 1.1s ease-out infinite}
@keyframes dictPulse{
  0%{box-shadow:0 0 0 0 rgba(232,72,60,.55)}
  70%{box-shadow:0 0 0 18px rgba(232,72,60,0)}
  100%{box-shadow:0 0 0 0 rgba(232,72,60,0)}
}
.dict-result{margin-top:12px;padding:13px 14px;border:3px solid var(--ink);border-radius:18px;background:#fffdf8;text-align:center}
.dict-result .num{font-size:50px;line-height:1;letter-spacing:-1px}
.dict-result .num small{font-size:20px;font-weight:700}
.dict-stars{font-size:30px;letter-spacing:3px;margin-top:2px}
.dict-heard{font-size:15px;color:var(--ink-soft);margin-top:5px}
.dict-heard b{color:var(--ink)}
.dict-msg{font-size:17px;font-weight:700;margin-top:7px;line-height:1.35}
.dict-earn{display:inline-block;margin-top:9px;padding:3px 12px;border-radius:999px;
  background:linear-gradient(170deg,#ffe487,#f7c33d);border:2.5px solid #8a5c00;color:#503300;font-size:15px;font-weight:700}
.dict-replay{margin-top:9px}
.dict-replay:empty{display:none}
.dict-replay button{width:100%;min-height:48px;padding:0 15px;border:2.5px solid var(--ink);border-radius:13px;
  background:#f4f8ff;font-size:16px;font-weight:700}
.dict-defs{margin-top:10px}
.dict-def{padding:9px 11px;border:2.5px solid #d8c8ae;border-radius:14px;background:#fff;margin-top:7px}
.dict-def .pos{display:inline-block;font-size:12.5px;font-weight:700;background:#efe6d6;border-radius:8px;padding:1px 7px;color:#6b5a45}
.dict-def .txt{font-size:16px;margin-top:4px;line-height:1.4}
.dict-def .ex{font-size:14px;color:var(--ink-soft);margin-top:4px}
.dict-src{font-size:12.5px;color:#8a7f70;margin-top:10px;line-height:1.45}
@media (max-width:560px){
  .dict-word{font-size:31px}
  .dict-hero .dhemoji{font-size:44px}
  .dict-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));max-height:48vh}
  .dict-say{grid-template-columns:1fr 1fr}
  .dict-say .dsay.slow{grid-column:1 / -1}
}

/* ---------- 모달 ---------- */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;display:none;
  background:rgba(28,24,22,.55);backdrop-filter:blur(3px);
  padding:14px;overflow-y:auto;
}
.modal-backdrop.open{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:min(760px,100%);margin:12px auto 40px;
  background:var(--card);border:4px solid var(--ink);border-radius:26px;
  box-shadow:0 12px 0 rgba(0,0,0,.35);
  animation:rise .22s cubic-bezier(.2,.9,.3,1.2);
  overflow:hidden;
}
.modal.wide{width:min(980px,100%)}
@keyframes rise{from{transform:translateY(18px) scale(.98);opacity:.6}to{transform:none;opacity:1}}
.modal-head{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:linear-gradient(165deg,#f4695f,#d8352b);color:#fff;
  border-bottom:4px solid var(--ink);
}
.modal-head h3{font-size:20px;flex:1;min-width:0}
.modal-x{
  width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);background:#fff;color:var(--ink);
  font-size:19px;font-weight:700;display:grid;place-items:center;flex:none;
}
.modal-body{padding:14px 16px 18px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:0 16px 16px}

/* 도감 상세 */
.detail-top{display:flex;gap:14px;flex-wrap:wrap}
.detail-sprite-box{
  flex:none;width:172px;height:172px;display:grid;place-items:center;border:3.5px solid var(--ink);
  border-radius:22px;background:radial-gradient(circle at 50% 60%,#fffbe8,#f0e6d2);
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.6);
}
.detail-sprite{width:148px;height:148px;image-rendering:pixelated;filter:drop-shadow(0 6px 4px rgba(0,0,0,.2))}
.detail-main{flex:1;min-width:200px}
.detail-name{font-size:28px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.detail-no{font-size:15px;color:var(--ink-soft);font-weight:700}
.detail-genus{font-size:15px;color:var(--ink-soft);margin-top:2px}
.detail-types{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.detail-meta{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;font-size:15px}
.detail-meta b{font-weight:700}
.flavor{
  margin-top:12px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;
  font-size:15.5px;line-height:1.5;position:relative;
}
.flavor::before{content:'도감 설명';position:absolute;top:-11px;left:12px;background:var(--yellow);border:2.5px solid var(--ink);border-radius:8px;font-size:11.5px;padding:0 6px;font-weight:700}
.stats-list{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.stat-row{display:flex;align-items:center;gap:8px;font-size:14px}
.stat-row .sname{width:66px;flex:none;font-weight:700;color:var(--ink-soft)}
.stat-bar{flex:1;height:13px;border:2.5px solid var(--ink);border-radius:9px;background:#f3ead9;overflow:hidden}
.stat-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff8f3f);border-radius:6px}
.stat-row .sval{width:34px;text-align:right;font-weight:700}
.moves-wrap{margin-top:16px}
.moves-title{font-size:17px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.moves{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:7px}
.move-btn{
  border:2.5px solid var(--ink);border-radius:12px;background:#fff;padding:7px 9px;
  font-size:14.5px;font-weight:700;text-align:left;display:flex;align-items:center;gap:6px;
  box-shadow:0 3px 0 rgba(43,43,51,.16);
}
.move-btn:active{transform:translateY(2px);box-shadow:none}
.move-btn .mt{width:9px;height:22px;border-radius:5px;flex:none}
.move-detail{
  margin-top:10px;border:3px dashed #cbb99d;border-radius:14px;padding:10px 12px;background:#fffdf3;font-size:14.5px;line-height:1.5;
}
.move-detail h4{font-size:16px;margin-bottom:4px}
.move-kv{display:flex;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-soft);margin:4px 0 6px}
/* 배운 기술 칩 — 누르면 기술 연출이 다시 열립니다 */
.learned-wrap{margin-top:16px;border-top:3px dashed #e3d6bf;padding-top:12px}
.learned-chips{display:flex;flex-wrap:wrap;gap:7px;max-height:150px;overflow-y:auto}
.learned-chip{
  display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--ink);border-radius:999px;
  background:#fff;padding:6px 11px 6px 8px;font-size:14px;font-weight:700;color:var(--ink);
  box-shadow:0 3px 0 rgba(43,43,51,.16);
}
.learned-chip:active{transform:translateY(2px);box-shadow:none}
.learned-chip .lc-dot{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.25)}
.learned-chip .lc-lv{font-size:11.5px;font-weight:800;color:#8a5a00;background:#fff3c4;border-radius:999px;padding:1px 7px}
.evo-track{display:flex;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.evo-stage{
  border:3px solid #cbb99d;border-radius:16px;padding:6px;width:96px;text-align:center;background:#fff;opacity:.55;
}
.evo-stage.on{border-color:var(--ink);opacity:1;box-shadow:0 4px 0 rgba(43,43,51,.2)}
.evo-stage img{width:64px;height:64px;image-rendering:pixelated}
.evo-stage span{display:block;font-size:12.5px;font-weight:700;line-height:1.15}
.evo-arrow{font-size:18px;color:var(--ink-soft)}
.detail-loading{padding:30px;text-align:center;font-size:15px;color:var(--ink-soft)}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid #eadfcd;border-top-color:var(--dex-red);margin:0 auto 10px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 포켓몬 박스 ---------- */
.box-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:flex;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{border:none;background:#fff;padding:7px 11px;font-size:14px;font-weight:700}
.seg button.active{background:var(--yellow)}
.box-count{font-size:14px;font-weight:700;color:var(--ink-soft);margin-left:auto}
.box-screen{
  background:linear-gradient(180deg,#3f8f5c,#52a873);
  border:4px solid var(--ink);border-radius:16px;padding:10px;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.22);
}
.box-label{display:flex;justify-content:space-between;color:#eaffef;font-size:13px;font-weight:700;margin-bottom:6px;letter-spacing:1px}
.box-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.box-cell{
  background:rgba(255,255,255,.92);border:2.5px solid #1f5c39;border-radius:10px;
  padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:11.5px;font-weight:700;min-height:84px;position:relative;
}
.box-cell img{width:48px;height:48px;image-rendering:pixelated}
.box-cell .bno{font-size:10px;color:#6b6b6b;position:absolute;left:4px;top:2px}
.box-cell.on{border-color:#ffd23f;box-shadow:0 0 0 3px #ffd23f inset}
.box-cell .bname{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.box-cell .blv{
  position:absolute;right:3px;top:2px;font-size:10px;font-weight:800;color:#1f5c39;background:#ffd23f;
  border:1.5px solid #1f5c39;border-radius:6px;padding:0 3px;line-height:1.35;
}
.box-screen.mega{background:linear-gradient(180deg,#6f45b5,#9b6ad8);margin-bottom:10px}
.box-cell.empty{background:rgba(255,255,255,.13);border-style:dashed;border-color:rgba(31,92,57,.45)}
.box-cell.empty .bno{color:rgba(234,255,239,.55)}
.box-empty{color:#eaffef;font-size:14px;text-align:center;padding:20px 10px;line-height:1.6}
.box-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* ---------- 뽑기 ---------- */
.gacha-stage{
  text-align:center;padding:8px 4px 2px;position:relative;min-height:300px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.big-ball{
  width:128px;height:128px;border-radius:50%;border:6px solid var(--ink);position:relative;
  background:linear-gradient(to bottom,#f4625a 0 45%,var(--ink) 45% 55%,#fff 55% 100%);
  box-shadow:0 8px 0 rgba(43,43,51,.25);
}
.big-ball::after{
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:38px;height:38px;border-radius:50%;background:#fff;border:6px solid var(--ink);
  box-shadow:inset 0 0 0 3px #eee;
}
.shaking{animation:shake .62s ease-in-out infinite}
@keyframes shake{
  0%,100%{transform:rotate(-14deg)}
  25%{transform:rotate(12deg)}
  50%{transform:rotate(-9deg)}
  75%{transform:rotate(7deg)}
}
.gacha-msg{font-size:18px;font-weight:700}
.gacha-hint{font-size:14px;color:var(--ink-soft)}
.catch-card{
  width:100%;max-width:420px;background:#fff;border:4px solid var(--ink);border-radius:22px;
  padding:14px;box-shadow:0 8px 0 rgba(43,43,51,.22);animation:pop .45s ease;
}
.catch-sprite{width:140px;height:140px;image-rendering:pixelated;filter:drop-shadow(0 6px 4px rgba(0,0,0,.2))}
.catch-name{font-size:24px;margin-top:2px}
.catch-sub{font-size:14px;color:var(--ink-soft)}
.gacha-burst{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.95), rgba(255,255,255,0) 60%);
  animation:burst .6s ease-out forwards;
}
@keyframes burst{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1.4)}}

/* ---------- 스타터 ---------- */
.starter-intro{text-align:center;margin-bottom:12px}
.starter-intro h3{font-size:22px;margin-bottom:4px}
.starter-intro p{font-size:14.5px;color:var(--ink-soft);line-height:1.5}
.starter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.starter-pick{
  border:3.5px solid var(--ink);border-radius:18px;background:linear-gradient(180deg,#fffdf4,#f6efdd);
  padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 5px 0 rgba(43,43,51,.22);
}
.starter-pick:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(43,43,51,.22)}
.starter-pick img{width:96px;height:96px;image-rendering:pixelated}
.starter-pick strong{font-size:16px}
.starter-pick small{font-size:12px;color:var(--ink-soft)}
.starter-pick:hover{background:#fffbe8}

/* ---------- 설정 ---------- */
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{
  border:3px solid var(--ink);border-radius:14px;background:#fff;padding:8px 13px;
  font-size:15px;font-weight:700;box-shadow:0 3px 0 rgba(43,43,51,.2);
}
.tab.active{background:var(--yellow)}
.set-group{border:3px solid var(--ink);border-radius:16px;padding:11px 12px;margin-bottom:12px;background:#fff}
.set-group h4{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.field{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.field label{font-size:14.5px;font-weight:700;min-width:88px}
.field input[type=text],.field input[type=number],.field select{
  flex:1 1 150px;min-width:0;height:42px;border:2.5px solid var(--ink);border-radius:11px;
  padding:0 9px;font-size:15px;background:#fff;
}
.field .hint{font-size:12.5px;color:var(--ink-soft);flex-basis:100%;margin-left:96px}
.switch{
  width:64px;height:36px;border-radius:20px;border:3px solid var(--ink);background:#ded4c4;position:relative;flex:none;
}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);transition:left .16s ease}
.switch.on{background:var(--green)}
.switch.on::after{left:30px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:3px solid var(--ink);border-radius:13px;background:#fff;padding:9px 14px;
  font-size:15px;font-weight:700;min-height:44px;box-shadow:0 4px 0 rgba(43,43,51,.22);
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(43,43,51,.22)}
.btn.primary{background:var(--blue);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.btn.warn{background:#ffe2dd}
.btn.green{background:var(--green);color:#fff}
.btn.sm{padding:6px 10px;font-size:13.5px;min-height:36px;border-width:2.5px}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 rgba(43,43,51,.12)}

.task-edit-list{display:flex;flex-direction:column;gap:7px}
.te-sec{border:2.5px dashed #d6c5ab;border-radius:14px;padding:9px 10px;background:#fffdf7}
.te-head{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.te-head input{flex:1;min-width:0;height:38px;border:2.5px solid var(--ink);border-radius:10px;padding:0 8px;font-size:15px;font-weight:700;background:#fff}
.te-row{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.te-row input[type=text]{flex:1;min-width:0;height:38px;border:2.5px solid var(--ink);border-radius:10px;padding:0 8px;font-size:14.5px;background:#fff}
.te-row input[type=text].emo{flex:0 0 52px;text-align:center;padding:0 2px}
.te-row .mini-btn{width:34px;height:34px;border-width:2.5px;font-size:14px;box-shadow:0 2px 0 rgba(43,43,51,.22)}
.te-add{margin-top:4px}
.reward-list{display:flex;flex-direction:column;gap:7px}
.reward-row{display:flex;align-items:center;gap:7px;border:2.5px solid var(--ink);border-radius:12px;padding:7px 9px;background:#fff}
.reward-row .remoji{font-size:20px}
.reward-row .rname{flex:1;min-width:0}
.reward-row input.rname-input{flex:1;min-width:0;height:36px;border:2.5px solid #cbb99d;border-radius:9px;padding:0 8px;font-size:14.5px;background:#fffdf7}
.reward-row .rcost{display:flex;align-items:center;gap:3px;font-size:14px;font-weight:700}
.reward-row input.rcost-input{width:60px;height:36px;border:2.5px solid #cbb99d;border-radius:9px;padding:0 6px;font-size:14px;text-align:center;background:#fffdf7}
.star-pill{display:inline-flex;align-items:center;gap:4px;background:#fff3c4;border:2.5px solid var(--ink);border-radius:20px;padding:2px 10px;font-weight:700;font-size:15px}
.redeem-log{font-size:13.5px;color:var(--ink-soft);line-height:1.6}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px}
.shop-item{
  border:3px solid var(--ink);border-radius:16px;background:linear-gradient(180deg,#fffdf4,#f7f0df);
  padding:10px;display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center;
  box-shadow:0 4px 0 rgba(43,43,51,.18);
}
.shop-item .semoji{font-size:28px}
.shop-item .sname{font-size:15.5px;font-weight:700;line-height:1.25}
.shop-item .scost{font-size:14px;font-weight:700;color:#b8860b}
.shop-item .btn{width:100%}
.shop-item.locked{opacity:.62}
.shop-item.locked .btn{background:#eee6d8}

/* ---------- 토스트 ---------- */
.toast-wrap{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,92vw)}
.toast{
  background:var(--ink);color:#fff;border:3px solid #fff;border-radius:16px;
  padding:10px 16px;font-size:15px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.28);
  animation:toastIn .25s ease, toastOut .3s ease 2.2s forwards;text-align:center;max-width:100%;
}
.toast.gold{background:linear-gradient(170deg,#ffcf3f,#f5a623);color:#4a3200;border-color:#4a3200}
@keyframes toastIn{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(-8px);opacity:0}}

/* ---------- 진화 연출 ---------- */
.evo-stage-anim{
  position:fixed;inset:0;z-index:180;display:grid;place-items:center;
  background:radial-gradient(circle,#fff,#ffe7b8 55%,#ffd27a);animation:evoflash 1.9s ease forwards;
}
@keyframes evoflash{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
.evo-stage-anim img{width:200px;height:200px;image-rendering:pixelated;animation:evopulse .9s ease-in-out infinite alternate}
@keyframes evopulse{from{transform:scale(.94);filter:brightness(1.4)}to{transform:scale(1.06);filter:brightness(2.2)}}
.evo-stage-anim .evo-txt{font-size:20px;font-weight:700;color:#8a4b00;margin-top:6px;text-align:center}

/* ---------- 연속 기록 프리패스(🛡️) 배지 ---------- */
.pstat .shield{
  display:inline-flex;align-items:center;gap:1px;margin-left:2px;padding:0 4px;
  font-size:.86em;line-height:1.35;border:2px solid var(--ink);border-radius:8px;
  background:#e8f1ff;white-space:nowrap;
}

/* ---------- 읽어주기(🔊) ---------- */
.task .tspeak{
  width:32px;height:32px;flex:none;display:grid;place-items:center;
  border:2.5px solid var(--ink);border-radius:50%;background:#fff3c4;
  font-size:15px;line-height:1;box-shadow:0 2px 0 rgba(43,43,51,.2);
}
.task .tspeak:active{transform:translateY(2px);box-shadow:none}

/* ---------- 구간 완료 칭찬 배너 ---------- */
.tasks-card{position:relative}
.praise-banner{
  display:none;position:absolute;left:50%;top:8px;transform:translateX(-50%);
  z-index:6;max-width:calc(100% - 24px);text-align:center;
  padding:9px 18px;border:3px solid var(--ink);border-radius:18px;
  background:linear-gradient(170deg,#fff6c9,#ffd23f);color:#4a3200;
  font-size:17px;font-weight:700;line-height:1.3;
  box-shadow:0 6px 0 rgba(43,43,51,.3), 0 10px 24px rgba(0,0,0,.16);
  pointer-events:none;

.hg-qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.hg-bar i{display:block;height:100%;background:linear-gradient(90deg,#8ee06a,#3fae64);transition:width .3s ease}
.hg-prompt{text-align:center;font-size:clamp(15px,2.4vw,17.5px);font-weight:700;line-height:1.4;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}

  border-radius:16px;background:#fffdf8;box-shadow:0 4px 0 rgba(43,43,51,.18);animation:hgPop .32s ease}

.hg-chunk.w4{background:#eef0ff;border-color:#8f97d8}

.hg-solved{display:flex;flex-direction:column;gap:10px;align-items:center;padding:6px 0}

/* 문제 푸는 동안의 '읽기' 안내 — 소리(듣기) 단서 대신 글자로만 도와줍니다 */

.hg-feedback{min-height:24px;font-size:15px;font-weight:800;text-align:center;line-height:1.4}

/* ---------- ✏️ 받아쓰기 ---------- */
.hg-say-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hg-say{min-height:64px;padding:6px 10px;border:3px solid #2f8a4e;border-radius:18px;
  background:linear-gradient(175deg,#f4fff0,#d8f2c8);color:#1f4d2b;font-family:inherit;
  font-size:clamp(16px,2.6vw,19px);font-weight:900;box-shadow:0 4px 0 #8bc078;touch-action:manipulation}

/* ---------- ➕➖ 두 자릿수 ---------- */
.hg-math{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 10px;border:3px dashed #cddcee;border-radius:20px;background:#fbfdff;flex-wrap:nowrap}

.hg-enq{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px;border:3px dashed #cddcee;border-radius:20px;background:#fbfdff}

/* ===============================================================
   레벨업 · 기술 배우기 연출 (큰 포켓몬 + 타입별 효과 + 기술 카드)
   =============================================================== */
.move-stage{
  --mv:#f7d02c;--mv2:#fff;
  position:fixed;inset:0;z-index:260;display:none;place-items:center;padding:16px;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,rgba(34,26,44,.88),rgba(10,8,14,.95));
}
.move-stage.open{display:grid;animation:fade .18s ease}
.move-stage .mv-bg{
  position:absolute;inset:-12%;pointer-events:none;filter:blur(8px);opacity:.45;
  background:radial-gradient(circle at 50% 48%,var(--mv),transparent 62%);
  animation:mvBg 2.2s ease-in-out infinite alternate;
}
@keyframes mvBg{from{opacity:.3;transform:scale(.94)}to{opacity:.68;transform:scale(1.06)}}

.mv-card{
  position:relative;width:min(560px,100%);max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#fffdf6,#fff1d6);border:5px solid var(--ink);border-radius:28px;
  box-shadow:0 16px 0 rgba(0,0,0,.35);padding:14px 16px 18px;text-align:center;

        raw.hangul.date = todayKey();

        raw.hangul.rewarded = 0;
        raw.hangul.byMode = { dictation: 0, math: 0, english: 0 };

  var actx = null;

      o.frequency.value = freq;
      o.connect(g);
      g.connect(ac.destination);
      var t0 = ac.currentTime + (start || 0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.start(t0);
      o.stop(t0 + dur + 0.03);
    } catch (e) { /* ignore */ }
  }

  /* ---------------------------------------------------------------
     3-1. 읽어주기 (한국어 TTS) — 글을 아직 다 못 읽는 건률이를 위해
  --------------------------------------------------------------- */
  var TTS_OK = (function () {

  /* 기기의 목소리 목록 — 항상 새로 읽고, 비어 있으면 사전 쪽에 받아 둔 목록을 씁니다.
     (크롬·안드로이드는 처음에는 getVoices()가 비어 있다가 voiceschanged 뒤에 채워집니다) */
  function voiceList() {
    var list = [];
    try { list = (window.speechSynthesis && window.speechSynthesis.getVoices()) || []; }
    catch (e) { list = []; }
    if ((!list || !list.length) && dictVoices && dictVoices.length) list = dictVoices;
    return list || [];
  }
  /* 안드로이드는 ko_KR 처럼 밑줄을 쓰기도 해서 ko-kr 로 맞춥니다 */
  function voiceLangOf(v) {
    return String((v && v.lang) || '').replace(/_/g, '-').toLowerCase();
  }
  /* 한국인이 읽는 듯한 목소리 이름 — 구글·삼성·유나·서라 등 */
  var KO_VOICE_NAME = /google|samsung|yuna|sora|heami|injoon|sunhi|natural|neural|korean|한국/i;
  /* 한국어 목소리 고르기: 기기 기본 목소리가 영어여도 반드시 한국어 목소리를 씁니다.
     1) ko-KR + 자연스러운 이름  2) 아무 ko-KR  3) 아무 ko*  4) 없으면 null */
  function pickKoreanVoice() {
    var voices = voiceList();
    if (!voices.length) return null;
    var exact = [], near = [];
    voices.forEach(function (v) {
      var l = voiceLangOf(v);
      if (l === 'ko-kr') exact.push(v);
      else if (l.indexOf('ko') === 0) near.push(v);
    });
    var i;
    for (i = 0; i < exact.length; i++) {          // 1) ko-KR + 자연스러운 목소리
      if (KO_VOICE_NAME.test(String(exact[i].name || ''))) return exact[i];
    }
    if (exact.length) return exact[0];             // 2) 아무 ko-KR
    for (i = 0; i < near.length; i++) {            // 3) ko 로 시작(ko · ko-KP) 중 자연스러운 목소리
      if (KO_VOICE_NAME.test(String(near[i].name || ''))) return near[i];
    }
    return near.length ? near[0] : null;           // 4) 나머지 ko 목소리
  }
  var koVoiceMissNoticed = false;   // 한국어 음성이 없다는 안내는 한 번만

  function koSpeakText(t) {
    var s = cleanText(t)
      .replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}\u{200D}]/gu, ' ')
      .replace(/\s*[·ㆍ]\s*/g, ', ')
      .replace(/\s*&\s*/g, ' 그리고 ')
      .replace(/\s*\|+\s*/g, ', ')
      .replace(/\s+/g, ' ')
      .replace(/\s+([,.!?])/g, '$1')
      .trim();
    return s || cleanText(t);
  }

  function speak(text, rate) {
    var msg = koSpeakText(text);
    if (!msg) return false;
    if (!TTS_OK) { toast('이 기기에서는 읽어주기를 쓸 수 없어요'); return false; }
    try {
      var koVoice = pickKoreanVoice();
      window.speechSynthesis.cancel();
      var u = new window.SpeechSynthesisUtterance(msg);
      /* 목소리를 직접 지정해야 기기 기본(영어) 목소리로 읽지 않습니다 */
      if (koVoice) u.voice = koVoice;
      /* lang 은 표준 표기(ko-KR)로 — 안드로이드의 ko_KR 을 그대로 쓰지 않습니다 */
      u.lang = (koVoice && koVoice.lang) ? String(koVoice.lang).replace(/_/g, '-') : 'ko-KR';

  function cachePut(k, v) {

      return fetchJSON(sp.evoUrl).then(function (chain) {
        var path = null;
        function walk(node, trail) {
          if (idFromUrl(node.species && node.species.url) === Number(speciesId)) {
            return trail.concat([node]);
          }
          var kids = node.evolves_to || [];
          for (var i = 0; i < kids.length; i++) {
            var r = walk(kids[i], trail.concat([node]));
            if (r) return r;
          }
          return null;
        }
        path = walk(chain.chain, []);
        if (!path) return { ids: [speciesId], index: 0, total: 1, next: null };
        var ids = path.map(function (n) { return idFromUrl(n.species && n.species.url); });
        var last = path[path.length - 1];
        var trackIds = ids.slice();
        var probe = last;
        while (probe.evolves_to && probe.evolves_to.length) {
          probe = probe.evolves_to[0];
          trackIds.push(idFromUrl(probe.species && probe.species.url));
        }
        var next = (last.evolves_to && last.evolves_to.length)
          ? idFromUrl(last.evolves_to[0].species && last.evolves_to[0].species.url) : null;
        var info = { ids: ids, track: trackIds, index: ids.length - 1, total: trackIds.length, next: next };
        cachePut(key, info);
