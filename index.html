    if (c === 1) return { e: '🌤️', t: '대체로 맑음' };
    if (c === 2) return { e: '⛅', t: '구름 조금' };
    if (c === 3) return { e: '☁️', t: '흐림' };
    if (c === 45 || c === 48) return { e: '🌫️', t: '안개' };
    if (c >= 51 && c <= 57) return { e: '🌦️', t: '이슬비' };
    if (c >= 61 && c <= 65) return { e: '🌧️', t: '비' };
    if (c === 66 || c === 67) return { e: '🌧️', t: '어는 비' };
    if (c >= 71 && c <= 75) return { e: '🌨️', t: '눈' };
    if (c === 77) return { e: '🌨️', t: '눈날림' };
    if (c >= 80 && c <= 82) return { e: '🌦️', t: '소나기' };
    if (c === 85 || c === 86) return { e: '🌨️', t: '눈 소나기' };
    if (c === 95) return { e: '⛈️', t: '천둥번개' };
    if (c === 96 || c === 99) return { e: '⛈️', t: '우박' };
    return { e: '🌥️', t: '구름' };
  }

  function weatherURL() {
    var loc = S.settings.location;
    return 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat +
      '&longitude=' + loc.lon +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&current=temperature_2m,weather_code&timezone=Asia%2FSeoul&forecast_days=7';
  }

  function renderWeather(data) {
    var strip = $('weatherStrip');
    var daily = data && data.daily;
    if (!daily || !daily.time || !daily.time.length) {
      strip.innerHTML = weatherErrorHtml('🌥️ 날씨 정보를 찾지 못했어요');
      return;
    }
    var today = todayKey();
    var html = '';
    for (var i = 0; i < Math.min(5, daily.time.length); i++) {
      var dk = daily.time[i];
      var info = wmoInfo(daily.weather_code[i]);
      var label;
      if (i === 0 || dk === today) label = '오늘';
      else {
        var dd = parseDay(dk);
        label = (i === 1) ? '내일' : WEEKDAYS[dd.getDay()] + '요일';
      }
      var hi = Math.round(daily.temperature_2m_max[i]);
      var lo = Math.round(daily.temperature_2m_min[i]);
      var pop = daily.precipitation_probability_max ? daily.precipitation_probability_max[i] : null;
      html += '<div class="wx' + (i === 0 ? ' today' : '') + '">' +
        '<div class="day">' + esc(label) + '</div>' +
        '<div class="emo" title="' + esc(info.t) + '">' + info.e + '</div>' +
        '<div class="tmp">' + hi + '° <span class="lo">/ ' + lo + '°</span></div>' +
        '<div class="pop">' + (pop == null ? '&nbsp;' : '☔ ' + pop + '%') + '</div>' +
        '</div>';
    }
    strip.innerHTML = html;

    var cur = data.current || {};
    var loc = S.settings.location.name || '우리 동네';
    if (typeof cur.temperature_2m === 'number') {
      $('nowTemp').textContent = '🌡️ ' + Math.round(cur.temperature_2m * 10) / 10 + '°C · ' + loc;
    } else {
      $('nowTemp').textContent = '🌡️ ' + loc;
    }
  }

  function weatherErrorHtml(msg) {
    return '<div class="wx-state">' + esc(msg) +
      ' <button class="btn sm wx-retry" type="button" data-act="wx-retry">🔄 다시 불러오기</button></div>';
  }

  function loadWeather() {
    var strip = $('weatherStrip');
    if (strip) strip.innerHTML = '<div class="wx-state">🌤️ 날씨를 불러오는 중이에요...</div>';
    return fetchJSON(weatherURL()).then(function (data) {
      renderWeather(data);
    }).catch(function () {
      $('weatherStrip').innerHTML = weatherErrorHtml('🌥️ 날씨를 불러오지 못했어요 · 인터넷 연결을 확인해 주세요');
      $('nowTemp').textContent = '🌡️ ' + (S.settings.location.name || '우리 동네');
    });
  }

  /* ---------------------------------------------------------------
     7. 할 일 · XP · 몬스터볼
  --------------------------------------------------------------- */
  function findSection(id) {
    for (var i = 0; i < S.sections.length; i++) if (S.sections[i].id === id) return S.sections[i];
    return null;
  }
  function allTasks() {
    var out = [];
    S.sections.forEach(function (sec) {
      sec.tasks.forEach(function (t) { out.push({ sec: sec, task: t }); });
    });
    return out;
  }
  function isDone(taskId) { return !!(S.done && S.done.ids && S.done.ids[taskId]); }
  function isWeekend(d) {
    var w = (d || new Date()).getDay();
    return w === 0 || w === 6;
  }
  function xpNeed(level) { return 40 + (level - 1) * 20; }

  function addXp(amount) {
    // XP는 지금 파트너 포켓몬 한 마리에만 쌓입니다 (포켓몬마다 레벨이 따로!)
    var mon = activeMon(true);
    if (!mon) return false;
    var leveled = false;
    var learned = [];
    /* 레벨이 오르기 전에 '언제 어떤 기술을 배울지' 계획을 먼저 만들어 둡니다.
       (이미 지난 레벨의 기술은 조용히 '배운 기술'에 넣고, 새로 오르는 레벨만 연출해요) */
    ensureMovePlan(mon.id, pokemonTypesFor(mon.id));
    var monName = monDisplayName(mon.id);
    mon.xp += amount;
    var guard = 0;
    while (mon.xp >= xpNeed(mon.level) && guard < 50) {
      mon.xp -= xpNeed(mon.level);
      mon.level += 1;
      leveled = true;
      guard++;
      var got = learnMoveForLevel(mon, mon.level, monName);
      if (got) learned.push(got);
    }
    syncProgressFromActive();
    if (learned.length) queueMoveLearn(learned);
    return leveled;
  }

  /* ---- 구간별 맞춤 칭찬 멘트 ---- */
  var SECTION_PRAISE = {
    morning: '☀️ 아침 준비 끝! 오늘도 씩씩하게 출발하자!',
    afterschool: '🎒 하교 루틴 완벽! 이제 신나게 놀 준비 끝!',
    homework: '📚 숙제까지 척척! 건률이는 진짜 포켓몬 마스터!',
    weekend: '🌟 주말 할 일도 클리어! 최고야!'
  };
  var PRAISE_RULES = [
    { re: /아침|등원|출발/, msg: SECTION_PRAISE.morning },
    { re: /하교|하원|학교|방과/, msg: SECTION_PRAISE.afterschool },
    { re: /숙제|공부|책|수학|독서/, msg: SECTION_PRAISE.homework },
    { re: /주말|토요일|일요일/, msg: SECTION_PRAISE.weekend }
  ];

  function sectionPraise(sec) {
    if (!sec) return '';
    if (SECTION_PRAISE[sec.id]) return SECTION_PRAISE[sec.id];
    var name = String(sec.name || '');
    for (var i = 0; i < PRAISE_RULES.length; i++) {
      if (PRAISE_RULES[i].re.test(name)) return PRAISE_RULES[i].msg;
    }
    return '🎉 ' + name + ' 완벽! 정말 잘했어요!';
  }

  function markDayComplete() {
    var msgs = [];
    var t = todayKey();
    if (S.progress.lastCompleteDate === t) return msgs;
    var y = new Date();
    y.setDate(y.getDate() - 1);
    var yKey = dateKey(y);
    if (S.progress.lastCompleteDate === yKey) S.progress.streak = (S.progress.streak || 0) + 1;
    else S.progress.streak = 1;
    S.progress.lastCompleteDate = t;
    // 7일마다 프리패스(🛡️) 한 개 — 최대 2개까지 모을 수 있어요.
    if (S.progress.streak > 0 && S.progress.streak % 7 === 0) {
      if ((S.progress.streakShield || 0) < 2) {
        S.progress.streakShield = (S.progress.streakShield || 0) + 1;
        msgs.push('🛡️ 연속 ' + S.progress.streak + '일! 프리패스 ' + S.progress.streakShield + '개를 받았어요!');
      } else {
        msgs.push('🔥 연속 ' + S.progress.streak + '일 달성! 정말 대단해요!');
      }
    }
    return msgs;
  }

  /* 날짜가 바뀌었을 때 연속 기록 점검 — 하루를 빠졌으면 프리패스로 한 번 지켜 줍니다. */
  function rolloverStreak() {
    var y = new Date(); y.setDate(y.getDate() - 1);
    var yKey = dateKey(y);
    var beforeKey = dateKey(addDays(y, -1));   // 어제의 전날
    var t = todayKey();
    var lc = S.progress.lastCompleteDate || '';
    if (lc === t || lc === yKey) return '';            // 오늘·어제 했으면 그대로
    if (!S.progress.streak) return '';                 // 지켜 줄 연속 기록이 없음
    if (lc === beforeKey && (S.progress.streakShield || 0) > 0) {
      // 딱 하루만 빠졌다 → 프리패스 1개를 써서 연속 기록 유지
      S.progress.streakShield -= 1;
      S.progress.lastCompleteDate = yKey;
      return '🛡️ 프리패스 사용! 어제 하루 쉬었지만 연속 기록이 지켜졌어요!';
    }
    S.progress.streak = 0;
    return '';
  }

  /* ---- 날짜별 완료 기록 (부모용 주간 리포트) ---- */
  function applicableTaskList(d) {
    var weekend = isWeekend(d);
    var out = [];
    S.sections.forEach(function (sec) {
      if (sec.weekendOnly && !weekend) return;
      (sec.tasks || []).forEach(function (t) { out.push(t); });
    });
    return out;
  }

  function pruneHistory() {
    var keys = Object.keys(S.historyByDate || {}).sort();
    while (keys.length > 60) delete S.historyByDate[keys.shift()];
  }

  function recordHistoryFor(dateStr, ids) {
    if (!dateStr) return;
    var day = parseDay(dateStr);
    if (!day || isNaN(day.getTime())) return;
    if (!S.historyByDate || typeof S.historyByDate !== 'object') S.historyByDate = {};
    S.historyByDate[dateStr] = {
      doneIds: Object.keys(ids || {}),
      totalCount: applicableTaskList(day).length
    };
    pruneHistory();
  }

  function recordHistory() {
    recordHistoryFor((S.done && S.done.date) || todayKey(), (S.done && S.done.ids) || {});
  }

  function doneCountAll() {
    var n = 0;
    allTasks().forEach(function (x) { if (isDone(x.task.id)) n++; });
    return n;
  }

  function evaluateAwards(secId) {
    var out = { messages: [], praise: '' };
    // 1) 섹션 완료 보너스 + 구간별 칭찬
    var sec = findSection(secId);
    if (sec && sec.tasks.length) {
      var allDone = sec.tasks.every(function (t) { return isDone(t.id); });
      if (allDone && S.progress.sectionsToday.indexOf(sec.id) === -1) {
        S.progress.sectionsToday.push(sec.id);
        S.progress.balls += 1;
        out.messages.push('🎉 ' + sec.name + ' 완료! 몬스터볼 +1');
        out.praise = sectionPraise(sec);
      }
    }
    // 2) 30 XP 마다 몬스터볼 (토요일에서 넘어온 주말 체크는 오늘 몫으로 세지 않아요)
    var want = Math.floor(doneCountForBalls() * 10 / 30);
    var given = 0;
    while (S.progress.ballsAwardedToday < want && given < 20) {
      S.progress.ballsAwardedToday += 1;
      S.progress.balls += 1;
      given++;
    }
    if (given > 0) out.messages.push('⚪ 몬스터볼 ' + given + '개를 받았어요!');
    return out;
  }

  function toggleTask(secId, taskId) {
    var sec = findSection(secId);
    if (!sec) return;
    var exists = false;
    sec.tasks.forEach(function (t) { if (t.id === taskId) exists = true; });
    if (!exists) return;

    var wasDone = isDone(taskId);
    var leveled = false;
    var streakMsgs = [];
    if (wasDone) {
      delete S.done.ids[taskId];
      S.progress.stars = Math.max(0, S.progress.stars - 1);
      var undoMon = activeMon(true);
      if (undoMon) undoMon.xp = Math.max(0, undoMon.xp - 10);
      syncProgressFromActive();
      sndUncheck();
    } else {
      S.done.ids[taskId] = true;
      S.progress.stars += 1;
      leveled = addXp(10);
      streakMsgs = markDayComplete();
      sndCheck();
    }
    var awards = wasDone ? { messages: [], praise: '' } : evaluateAwards(secId);
    var msgs = awards.messages.concat(streakMsgs);
    recordHistory();
    save();
    renderTasks();
    paintPartnerProgress();
    renderPartnerStats();

    if (!wasDone) {
      if (awards.praise) showPraise(awards.praise);
      msgs.forEach(function (m, i) {
        setTimeout(function () { toast(m, 'gold'); sndBall(); }, 260 + i * 700);
      });
      if (msgs.length || awards.praise) sndFanfare();
      if (leveled) {
        setTimeout(function () {
          toast('✨ 레벨 업! Lv.' + S.progress.level, 'gold');
          sndFanfare();
          paintPartnerProgress();
          refreshEvolveButton();
        }, 180);
      }
    }
    flushHeader();
  }

  function renderTasks() {
    var wrap = $('sections');
    var weekend = isWeekend();
    var html = '';
    var totalDone = 0, totalAll = 0;

    S.sections.forEach(function (sec) {
      var isWeek = !!sec.weekendOnly;
      var appliesToday = !isWeek || weekend;
      var tasks = sec.tasks;
      var done = tasks.filter(function (t) { return isDone(t.id); }).length;
      if (appliesToday) { totalDone += done; totalAll += tasks.length; }
      var complete = tasks.length > 0 && done === tasks.length;
      var cls = 'section';
      if (isWeek) cls += ' weekend';
      if (isWeek && weekend) cls += ' hot';
      if (complete) cls += ' done';

      html += '<div class="' + cls + '" data-sec="' + esc(sec.id) + '">';
      html += '<div class="sec-head">';
      html += '<span class="sec-emoji">' + esc(sec.emoji || '📌') + '</span>';
      html += '<span class="sec-name">' + esc(sec.name) +
        '<small>' + (isWeek ? (weekend ? '토·일 연속 체크 🎉' : '주말에 해요') : tasks.length + '개') + '</small></span>';
      if (complete) html += '<span class="sec-badge">🎉</span>';
      html += '<span class="sec-count">' + done + '/' + tasks.length + '</span>';
      html += '</div>';
      var pct = tasks.length ? Math.round(done * 100 / tasks.length) : 0;
      html += '<div class="sec-progress"><i style="width:' + pct + '%"></i></div>';
      html += '<div class="tasks">';
      if (!tasks.length) {
        html += '<div class="task-empty">할 일이 없어요. 부모 설정에서 추가할 수 있어요.</div>';
      }
      tasks.forEach(function (t) {
        var d = isDone(t.id);
        html += '<button type="button" class="task' + (d ? ' done' : '') + '" data-sec="' + esc(sec.id) +
          '" data-task="' + esc(t.id) + '" aria-pressed="' + (d ? 'true' : 'false') + '">' +
          '<span class="temoji">' + esc(t.emoji || '✔️') + '</span>' +
          '<span class="ttext">' + esc(t.text) + '</span>' +
          (TTS_OK ? '<span class="tspeak" role="button" aria-label="' + esc(t.text) + ' 읽어주기"' +
            ' data-text="' + esc(t.text) + '">🔊</span>' : '') +
          '<span class="tcheck">' + (d ? '✓' : '') + '</span>' +
          '</button>';
      });
      html += '</div></div>';
    });

    wrap.innerHTML = html;

    var ring = $('todayRing');
    var pctAll = totalAll ? Math.round(totalDone * 100 / totalAll) : 0;
    if (ring) {
      ring.style.setProperty('--p', String(pctAll));
      $('todayRingText').textContent = pctAll + '%';
    }
    $('tasksFootRight').textContent = totalAll ? totalDone + ' / ' + totalAll + ' 완료' : '';

    var left = $('tasksFootLeft');
    if (pctAll === 100 && totalAll > 0) left.textContent = '🏆 오늘 할 일을 모두 끝냈어요! 최고!';
    else if (totalDone > 0) left.textContent = '👍 ' + (totalAll - totalDone) + '개만 더 하면 끝나요!';
    else left.textContent = '오늘도 화이팅! 💪';
  }
  /* ---------------------------------------------------------------
     8. 파트너 포켓몬
  --------------------------------------------------------------- */
  var partnerData = { id: 0, pokemon: null, species: null, evo: null };

  /* ---- 포켓몬별 레벨 · XP ---- */
  function monEntry(id, create) {
    id = Number(id) || 0;
    if (!id) return null;
    if (!S.box || typeof S.box !== 'object') S.box = {};
    var e = S.box[id];
    if (!e || typeof e !== 'object') {
      if (!create) return null;
      e = { id: id, caughtAt: Date.now(), from: 'pick', level: 1, xp: 0 };
      S.box[id] = e;
      return e;
    }
    if (typeof e.level !== 'number' || !(e.level >= 1)) e.level = 1;
    if (typeof e.xp !== 'number' || !(e.xp >= 0)) e.xp = 0;
    return e;
  }
  function activeMon(create) {
    return monEntry(S.partner && S.partner.id, create);
  }
  function monLevel(id) {
    var e = monEntry(id, false);
    if (e) return e.level;
    if (Number(id) === Number(S.partner && S.partner.id)) return Math.max(1, Number(S.progress.level) || 1);
    return 1;
  }
  function monXp(id) {
    var e = monEntry(id, false);
    if (e) return e.xp;
    if (Number(id) === Number(S.partner && S.partner.id)) return Math.max(0, Number(S.progress.xp) || 0);
    return 0;
  }
  /* 진행도(progress)를 지금 파트너의 레벨·XP와 맞춘다 (예전 화면 코드와 호환) */
  function syncProgressFromActive() {
    var e = activeMon(false);
    if (!e) return;
    S.progress.level = e.level;
    S.progress.xp = e.xp;
  }

  function partnerDisplayName() {
    var p = partnerData.pokemon, s = partnerData.species;
    if (p && s) return displayNameKo(p, s);
    var e = monEntry(S.partner && S.partner.id, false);
    if (e && e.nameKo) return e.nameKo;
    if (s && s.nameKo) return s.nameKo;
    if (p && p.name) return p.name;
    return 'No.' + (S.partner && S.partner.id);
  }

  function partnerLevel() { return monLevel(S.partner && S.partner.id); }

  function paintPartnerProgress() {
    var lv = partnerLevel();
    var need = xpNeed(lv);
    var xp = clamp(monXp(S.partner && S.partner.id), 0, need);
    $('partnerLv').textContent = 'Lv.' + lv;
    $('xpText').textContent = 'XP ' + xp + ' / ' + need;
    $('xpToNext').textContent = '다음 레벨까지 ' + Math.max(0, need - xp);
    $('xpFill').style.width = Math.round(xp * 100 / need) + '%';
  }

  function renderPartnerStats() {
    $('statStars').textContent = '⭐ ' + S.progress.stars;
    $('statBalls').textContent = '⚪ ' + S.progress.balls;
    $('statBox').textContent = '📦 ' + boxDexCount() + ' / ' + MAX_DEX;
    var megaCount = Object.keys(S.box || {}).filter(function (k) { return Number(k) > MAX_DEX; }).length;
    if (megaCount > 0) $('statBox').textContent += ' ✨' + megaCount;
    var shield = Math.max(0, Number(S.progress.streakShield) || 0);
    $('statStreak').innerHTML = '🔥 ' + (S.progress.streak || 0) + '일' +
      (shield > 0 ? '<span class="shield" title="연속 기록 프리패스 ' + shield + '회">🛡️ ' + shield + '</span>' : '');
    $('ballChip').textContent = String(S.progress.balls);
  }

  function paintTypes(el, types) {
    el.innerHTML = (types || []).map(function (t) {
      return '<span class="tbadge" style="background:' + (TYPE_COLOR[t] || '#999') + '">' + esc(TYPE_KO[t] || t) + '</span>';
    }).join('');
  }

  function paintPartner() {
    var p = partnerData.pokemon;
    var s = partnerData.species;
    if (!p) return;
    var name = displayNameKo(p, s || offlineSpecies(p.speciesId || p.id));
    var img = $('partnerSprite');
    if (p.sprite) img.src = p.sprite;
    img.alt = name;
    $('partnerName').textContent = name;
    $('partnerNo').textContent = p.id > MAX_DEX ? '✨ ' + dexNo((s && s.id) || p.speciesId) : dexNo(p.id);
    $('partnerGenus').textContent = (s && s.genusKo) || '포켓몬';
    paintTypes($('partnerTypes'), p.types);
    paintPartnerProgress();
    renderPartnerStats();
    paintEvoDots();
    paintSpecialEvo();
  }

  function refreshPartner(force) {
    var id = S.partner.id;
    if (!force && partnerData.pokemon && partnerData.id === id) { paintPartner(); return Promise.resolve(); }
    // 인터넷을 기다리는 동안에도 아는 포켓몬이면 바로 보여 준다 — "불러오는 중"에 멈추지 않도록
    var offP = offlinePokemon(id);
    var offS = offlineSpecies(id);
    if (offP) {
      if (offP.sprite) $('partnerSprite').src = offP.sprite;
      $('partnerName').textContent = displayNameKo(offP, offS);
      $('partnerNo').textContent = offP.id > MAX_DEX ? '✨ ' + dexNo((offS && offS.id) || offP.speciesId) : dexNo(offP.id);
      $('partnerGenus').textContent = (offS && offS.genusKo) || '포켓몬';
      paintTypes($('partnerTypes'), offP.types);
    } else {
      $('partnerGenus').textContent = '도감을 불러오는 중...';
    }
    return getPokemon(id).then(function (p) {
      partnerData.pokemon = p;
      partnerData.id = p.id;
      paintPartner();
      prefetchMovePool(p);          // 실제 기술 목록을 받아 두면 레벨업 때 그 기술을 배워요
      return getSpecies(p.speciesId).then(function (s) {
        partnerData.species = s;
        paintPartner();
        return getEvoInfo(p.speciesId).then(function (evo) {
          partnerData.evo = evo;
          paintEvoDots();
          refreshEvolveButton();
        }).catch(function () { });
      });
    }).catch(function () {
      if (offP) return;   // 기본 도감으로 이미 보여 주고 있으면 그대로 둔다
      $('partnerGenus').innerHTML = '포켓몬 정보를 불러오지 못했어요 · ' +
        '<button class="link-btn" type="button" data-act="partner-retry">🔄 다시 불러오기</button>';
      var img = $('partnerSprite');
      if (!img.getAttribute('src') || img.getAttribute('src') === BLANK) img.src = SPRITE + id + '.png';
      paintPartnerProgress();
      renderPartnerStats();
    });
  }

  function evoNeedLevel() {
    var evo = partnerData.evo;
    if (!evo || !evo.next) return null;
    return EVO_LEVELS[Math.min(evo.index, EVO_LEVELS.length - 1)];
  }

  /* 지금 파트너가 메가진화 · 원시회귀할 수 있는 모습들 (최종 진화 단계일 때) */
  function partnerSpecialForms() {
    var p = partnerData.pokemon, s = partnerData.species, evo = partnerData.evo;
    if (!p || !s) return [];
    if (specialFormKind(p.name)) return [];                 // 이미 메가 · 원시 모습이면 더 없음
    if (!evo || evo.next) return [];                        // 아직 최종 진화가 아니면 잠금
    return (s.specialForms || []).filter(function (f) {
      return f && f.id && Number(f.id) !== Number(p.id);
    });
  }

  function specialEvoInfo() {
    var forms = partnerSpecialForms();
    if (!forms.length) return null;
    var lv = partnerLevel();
    return {
      forms: forms,
      need: SPECIAL_EVO_LEVEL,
      label: specialKindLabel(forms[0].kind),
      ready: lv >= SPECIAL_EVO_LEVEL
    };
  }

  function specialTail(sp) {
    return ' <span style="margin-left:6px">' +
      (sp.ready ? '✨ ' + sp.label + '할 수 있어요!' : 'Lv.' + sp.need + '에 ' + sp.label + '!') + '</span>';
  }

  function paintEvoDots() {
    var el = $('partnerEvo');
    if (!el) return;
    var evo = partnerData.evo;
    var sp = specialEvoInfo();
    var curKind = partnerData.pokemon ? specialFormKind(partnerData.pokemon.name) : '';
    if (!evo) { el.innerHTML = sp ? specialTail(sp) : ''; return; }
    var total = Math.max(evo.total || 1, evo.index + 1);
    var html = '';
    for (var i = 0; i < total; i++) {
      if (i > 0) html += '<span class="lnk"></span>';
      html += '<span class="dot' + (i <= evo.index ? ' on' : '') + '"></span>';
    }
    var need = evoNeedLevel();
    var tail = '';
    if (evo.next && need != null) {
      tail = ' <span style="margin-left:6px">' +
        (partnerLevel() >= need ? '✨ 진화할 수 있어요!' : 'Lv.' + need + '에 진화!') + '</span>';
    } else if (!evo.next) {
      if (sp) tail = specialTail(sp);
      else if (curKind === 'primal') tail = ' <span style="margin-left:6px">🌋 원시회귀한 모습!</span>';
      else if (curKind) tail = ' <span style="margin-left:6px">✨ 메가진화한 모습!</span>';
      else tail = ' <span style="margin-left:6px">최종 진화 🌟</span>';
    }
    el.innerHTML = html + tail;
  }

  function refreshEvolveButton() {
    var btn = $('btnEvolve');
    var need = evoNeedLevel();
    var evo = partnerData.evo;
    if (btn) {
      if (evo && evo.next && need != null && partnerLevel() >= need) btn.classList.remove('hide');
      else btn.classList.add('hide');
    }
    paintSpecialEvo();
  }

  /* 메가진화 · 원시회귀 버튼 (한 마리에 X · Y 두 모습이 있으면 버튼 두 개) */
  function paintSpecialEvo() {
    var wrap = $('specialEvo');
    if (!wrap) return;
    var sp = specialEvoInfo();
    if (!sp) { wrap.innerHTML = ''; wrap.classList.add('hide'); return; }
    wrap.classList.remove('hide');
    var baseKo = (partnerData.species && partnerData.species.nameKo) || '';
    wrap.innerHTML = sp.forms.map(function (f) {
      var label = formDisplayName(baseKo, f.name) || ('No.' + f.id);
      if (!sp.ready) {
        return '<button class="pbtn evolve locked" type="button" disabled>🔒 Lv.' + sp.need + ' ' + esc(label) + '</button>';
      }
      return '<button class="pbtn evolve" type="button" data-act="evolve-form" data-id="' + f.id + '">✨ ' +
        esc(label) + (f.kind === 'primal' ? ' 원시회귀' : ' 진화') + '</button>';
    }).join('');
  }

  function doEvolve(targetId) {
    var mon = activeMon(false);
    var srcLevel = mon ? mon.level : Math.max(1, Number(S.progress.level) || 1);
    var srcXp = mon ? mon.xp : Math.max(0, Number(S.progress.xp) || 0);
    var explicit = (targetId == null || targetId === '') ? 0 : Number(targetId);
    var nextId = 0;
    var from = 'evolve';

    if (explicit) {
      // 메가진화 · 원시회귀
      var sp = specialEvoInfo();
      if (!sp || !sp.ready) return;
      var form = null;
      sp.forms.forEach(function (f) { if (Number(f.id) === explicit) form = f; });
      if (!form) return;
      nextId = Number(form.id);
      from = form.kind === 'primal' ? 'primal' : 'mega';
    } else {
      // 보통 진화
      var evo = partnerData.evo;
      var need = evoNeedLevel();
      if (!evo || !evo.next || need == null || srcLevel < need) return;
      nextId = Number(evo.next);
    }

    closeModal();
    getPokemon(nextId).then(function (p) {
      return getSpecies(p.speciesId).catch(function () { return null; }).then(function (s) {
        return { p: p, s: s };
      });
    }).then(function (res) {
      var p = res.p, s = res.s;
      var name = displayNameKo(p, s) || ('No.' + nextId);
      var overlay = document.createElement('div');
      overlay.className = 'evo-stage-anim';
      overlay.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center">' +
        '<img src="' + esc(p.sprite || SPRITE + nextId + '.png') + '" alt="">' +
        '<div class="evo-txt">진화 중...</div></div>';
      document.body.appendChild(overlay);
      sndEvolve();
      setTimeout(function () {
        var txt = overlay.querySelector('.evo-txt');
        if (txt) {
          txt.textContent = from === 'primal' ? '원시회귀 중... ' + name
            : (from === 'mega' ? '메가진화! ' + name : '축하해요! ' + name + '(으)로 진화!');
        }
      }, 1100);
      setTimeout(function () {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        S.partner.id = nextId;
        var entry = S.box[nextId];
        if (!entry || typeof entry !== 'object') {
          entry = { id: nextId, caughtAt: Date.now() };
          S.box[nextId] = entry;
        }
        if (!entry.caughtAt) entry.caughtAt = Date.now();
        entry.level = srcLevel;          // 진화해도 레벨 · XP는 그대로 이어집니다
        entry.xp = srcXp;
        entry.nameKo = name;
        entry.sprite = p.sprite || '';
        entry.moveTypes = (p.types || []).slice();
        entry.from = from;
        partnerData.id = 0;
        syncProgressFromActive();
        save();
        refreshPartner(true);
        renderPartnerStats();
        toast('✨ ' + name + (from === 'primal' ? ' 원시회귀!' : (from === 'mega' ? ' 메가진화!' : '(으)로 진화했어요!')), 'gold');
      }, 2000);
    }).catch(function () {
      toast('진화 정보를 불러오지 못했어요. 다시 시도해 주세요.');
    });
  }

  /* ---------------------------------------------------------------
     9. 도감 상세 모달
  --------------------------------------------------------------- */
  function modalShell(title, bodyHtml, opts) {
    var o = opts || {};
    var cls = o.wide ? 'modal wide' : 'modal';
    return '<div class="' + cls + '" data-modal="1">' +
      '<div class="modal-head"><h3>' + esc(title) + '</h3>' +
      (o.noClose ? '' : '<button class="modal-x" type="button" data-close="1" aria-label="닫기">✕</button>') + '</div>' +
      '<div class="modal-body">' + bodyHtml + '</div>' +
      (o.foot ? '<div class="modal-foot">' + o.foot + '</div>' : '') +
      '</div>';
  }

  function openModal(html, dismissible) {
    var root = $('modalRoot');
    root.innerHTML = html;
    root.classList.add('open');
    root.setAttribute('data-dismissible', dismissible === false ? '0' : '1');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    try { dictCleanup(); } catch (e) { }
    try { hangulState = hangulBlankState(); } catch (e) { }
    var root = $('modalRoot');
    root.classList.remove('open');
    root.innerHTML = '';
    document.body.style.overflow = '';
  }

  function openDetail(id) {
    var isPartner = Number(id) === Number(S.partner.id);
    openModal(modalShell('📖 포켓몬 도감',
      '<div class="detail-loading"><div class="spinner"></div>도감을 불러오는 중이에요...</div>',
      { wide: true }));

    getPokemon(id).then(function (p) {
      // 메가진화 · 원시 모습(No.10000 이상)은 종족 정보를 기본 종에서 가져옵니다
      var speciesId = p.speciesId || id;
      return Promise.all([
        Promise.resolve(p),
        getSpecies(speciesId).catch(function () { return null; }),
        getEvoInfo(speciesId).catch(function () { return null; })
      ]);
    }).then(function (res) {
      var p = res[0], s = res[1], evo = res[2];
      var name = displayNameKo(p, s);
      var formKind = specialFormKind(p.name);
      var lv = monLevel(p.id);
      var xp = Math.min(monXp(p.id), xpNeed(lv));
      var html = '<div class="detail-top">' +
        '<div class="detail-sprite-box"><img class="detail-sprite" src="' + esc(p.sprite || p.artwork) + '" alt="' + esc(name) + '"></div>' +
        '<div class="detail-main">' +
        '<div class="detail-name">' + esc(name) +
        (isPartner ? ' <span class="tbadge" style="background:#3fae64">파트너</span>' : '') +
        (formKind ? ' <span class="tbadge" style="background:#8a5bd0">' + esc(specialKindLabel(formKind)) + '</span>' : '') +
        '</div>' +
        '<div class="detail-no">' + dexNo(p.id > MAX_DEX ? ((s && s.id) || p.speciesId || p.id) : p.id) + '</div>' +
        '<div class="detail-genus">' + esc((s && s.genusKo) || '포켓몬') + '</div>' +
        '<div class="detail-types"></div>' +
        (isPartner
          ? '<div class="xp-wrap"><div class="xp-label"><span>Lv.' + lv + '</span><span>XP ' +
          xp + ' / ' + xpNeed(lv) + '</span></div>' +
          '<div class="xp-bar"><div class="xp-fill" style="width:' +
          Math.round(clamp(xp, 0, xpNeed(lv)) * 100 / xpNeed(lv)) + '%"></div></div></div>'
          : (monEntry(p.id, false) ? '<div class="detail-genus">Lv.' + lv + ' · XP ' + monXp(p.id) + '</div>' : '')) +
        '<div class="detail-meta">' +
        '<span>키 <b>' + (p.height / 10).toFixed(1) + 'm</b></span>' +
        '<span>몸무게 <b>' + (p.weight / 10).toFixed(1) + 'kg</b></span>' +
        (evo ? '<span>진화 <b>' + (evo.index + 1) + '단계 / ' + Math.max(evo.total, evo.index + 1) + '단계</b></span>' : '') +
        '</div>' +
        '</div></div>';

      html += '<div class="flavor">' + esc((s && s.flavor) || '아직 도감 설명이 없어요.') + '</div>';

      if (evo && (evo.track || evo.ids) && (evo.track || evo.ids).length > 1) html += '<div class="evo-track" id="evoTrack"></div>';

      html += '<div class="stats-list">';
      p.stats.forEach(function (st) {
        var label = STAT_KO[st.name] || st.name;
        var pct = clamp(Math.round(st.value * 100 / 180), 3, 100);
        html += '<div class="stat-row"><span class="sname">' + esc(label) + '</span>' +
          '<span class="stat-bar"><i style="width:' + pct + '%"></i></span>' +
          '<span class="sval">' + st.value + '</span></div>';
      });
      html += '</div>';

      html += '<div class="moves-wrap"><div class="moves-title">🥊 기술 <span style="font-size:13px;color:#5d5a66;font-weight:400">(눌러서 설명 보기)</span></div><div class="moves" id="movesList"></div><div id="moveDetail"></div></div>';

      /* 이 포켓몬이 배운 기술 — 칩을 누르면 레벨업 때와 같은 기술 연출을 다시 봅니다 */
      ensureMovePlan(p.id, p.types || pokemonTypesFor(p.id));
      var boxRec = monEntry(p.id, false);
      if (boxRec) {
        if (!boxRec.nameKo) boxRec.nameKo = name;
        if (p.sprite) boxRec.sprite = p.sprite;
      }
      prefetchMovePool(p);
      html += learnedMovesHtml(p.id);

      var foot = '<button class="btn" type="button" data-close="1">닫기</button>';
      if (!isPartner) foot = '<button class="btn primary" type="button" data-act="set-partner" data-id="' + p.id + '">⭐ 파트너로 설정</button>' + foot;

      openModal(modalShell('📖 ' + name, html, { wide: true, foot: foot }));
      paintTypes(document.querySelector('#modalRoot .detail-types'), p.types);

      // 기술 목록
      var movesEl = $('movesList');
      if (!p.moves || !p.moves.length) {
        movesEl.innerHTML = '<div class="empty-note">기술 정보가 없어요.</div>';
      } else {
        movesEl.innerHTML = p.moves.map(function (m) {
          return '<button class="move-btn" type="button" data-act="move" data-move="' + esc(m.name) + '">' +
            '<span class="mt" style="background:#cbb99d"></span>' +
            '<span class="tname" style="flex:1;text-align:left">' + esc(korMoveGuess(m.name)) + '</span>' +
            (m.lv ? '<span style="font-size:11px;color:#8a7f70">Lv.' + m.lv + '</span>' : '') +
            '</button>';
        }).join('');
        fillMoveNames(p.moves);
      }

      // 진화 트랙
      if (evo && (evo.track || evo.ids) && (evo.track || evo.ids).length > 1) renderEvoTrack(evo);
    }).catch(function () {
      openModal(modalShell('📖 포켓몬 도감',
        '<div class="detail-loading">도감을 불러오지 못했어요.<br>인터넷 연결을 확인하고 다시 열어 주세요.</div>',
        { foot: '<button class="btn primary" type="button" data-act="detail-retry" data-id="' + esc(id) + '">🔄 다시 불러오기</button>' +
          '<button class="btn" type="button" data-close="1">닫기</button>' }));
    });
  }

  // 기술 이름 영문 → 한글은 API 호출 후 바뀌므로 우선 영문 표기를 정리해 보여준다.
  function korMoveGuess(name) {
    return String(name || '').replace(/-/g, ' ');
  }

  // 기술 이름을 한글로 채워 넣는다 (한 번에 3개씩).
  function fillMoveNames(list) {
    var items = list || [];
    var i = 0;
    function round() {
      if (i >= items.length) return Promise.resolve();
      var chunk = items.slice(i, i + 3);
      i += 3;
      return Promise.all(chunk.map(function (m) {
        return getMove(m.name).then(function (mv) {
          var nodes = document.querySelectorAll('#movesList .move-btn[data-move="' + m.name + '"]');
          for (var j = 0; j < nodes.length; j++) {
            var el = nodes[j].querySelector('.tname');
            if (el) el.textContent = mv.nameKo;
            var mark = nodes[j].querySelector('.mt');
            if (mark) mark.style.background = TYPE_COLOR[mv.type] || '#cbb99d';
          }
        }).catch(function () { });
      })).then(round);
    }
    round();
  }

  function renderEvoTrack(evo) {
    var box = $('evoTrack');
    if (!box) return;
    var track = evo.track || evo.ids || [];
    box.innerHTML = '<div class="empty-note" style="width:100%">진화 정보를 불러오는 중...</div>';
    Promise.all(track.map(function (id) {
      return Promise.all([
        getPokemon(id).catch(function () { return null; }),
        getSpecies(id).catch(function () { return null; })
      ]);
    })).then(function (rows) {
      var html = '';
      rows.forEach(function (pair, i) {
        var p = pair[0], s = pair[1];
        if (!p) return;
        if (i > 0) html += '<span class="evo-arrow">➜</span>';
        html += '<div class="evo-stage' + (i === evo.index ? ' on' : '') + '">' +
          '<img src="' + esc(p.sprite || SPRITE + p.id + '.png') + '" alt="">' +
          '<span>' + esc((s && s.nameKo) || p.name) + '</span>' +
          '<span style="color:#8a7f70;font-weight:400">' +
          (i === 0 ? '시작' : 'Lv.' + (EVO_LEVELS[i - 1] || '-')) + '</span>' +
          '</div>';
      });
      box.innerHTML = html;
    }).catch(function () { box.innerHTML = ''; });
  }

  function showMoveDetail(name, btn) {
    var holder = $('moveDetail');
    if (!holder) return;
    holder.innerHTML = '<div class="empty-note">기술을 불러오는 중...</div>';
    getMove(name).then(function (m) {
      var color = TYPE_COLOR[m.type] || '#999';
      holder.innerHTML = '<div class="move-detail">' +
        '<h4><span class="tbadge" style="background:' + color + ';margin-right:6px">' + esc(TYPE_KO[m.type] || m.type) + '</span>' + esc(m.nameKo) + '</h4>' +
        '<div class="move-kv">' +
        '<span>위력 ' + (m.power == null ? '—' : m.power) + '</span>' +
        '<span>명중 ' + (m.accuracy == null ? '—' : m.accuracy) + '</span>' +
        '<span>PP ' + (m.pp == null ? '—' : m.pp) + '</span>' +
        '<span>분류 ' + esc(m.damageClass === 'physical' ? '물리' : m.damageClass === 'special' ? '특수' : '변화') + '</span>' +
        '</div>' +
        '<div>' + esc(m.desc || '설명이 없어요.') + '</div>' +
        '</div>';
      var buttons = document.querySelectorAll('#movesList .move-btn');
      for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove('on');
      if (btn) btn.style.boxShadow = '0 0 0 3px #ffd23f inset';
    }).catch(function () {
      holder.innerHTML = '<div class="empty-note">기술 정보를 불러오지 못했어요.</div>';
    });
  }

  /* ---------------------------------------------------------------
     9-2. ⚡ 레벨업 기술 배우기 · 기술 연출
     · 포켓몬마다 '언제 어떤 기술을 배울지' 계획(movePlan)을 만들어 둡니다.
       계획의 레벨 간격은 항상 2 이상 — 배운 레벨 바로 다음 레벨에는 배우지 않아요
       (Lv.2 를 배우면 Lv.3 은 건넌다, 다음은 Lv.4 이후).
     · 계획은 포켓몬 기록(S.box[id])에 저장되어 다시 열어도 그대로 이어집니다.
     · 레벨업하면 큰 포켓몬 · 타입별 효과 · 기술 카드 팝업을 띄우고,
       도감 상세에서는 '배운 기술' 칩을 눌러 같은 연출을 다시 볼 수 있어요.
  --------------------------------------------------------------- */
  var MOVE_LEARN_START_LEVEL = 2;      // 첫 기술은 Lv.2
  var MOVE_LEARN_GAP_MIN = 2;          // 배운 레벨 → 다음 레벨은 최소 +2 (한 레벨은 건너뜀)
  var MOVE_PLAN_END_LEVEL = 55;        // Lv.55 까지 계획
  var MOVE_PLAN_MAX = 16;              // 계획에 담을 기술 수
  var MOVE_LEARNED_MAX = 24;           // 기억해 둘 배운 기술 수

  /* 화면에 보여 줄 포켓몬 이름 — 파트너 · 박스 · 기본 도감 순서로 찾습니다 */
  function monDisplayName(id) {
    id = Number(id) || 0;
    if (!id) return '포켓몬';
    if (partnerData.pokemon && Number(partnerData.id) === id) {
      return displayNameKo(partnerData.pokemon, partnerData.species);
    }
    var e = monEntry(id, false);
    if (e && e.nameKo) return e.nameKo;
    var off = offlinePokemon(id);
    if (off) return off.ko;
    return 'No.' + id;
  }

  /* 이 포켓몬의 타입 — 계획을 만들 때 기술 후보를 고르는 데 씁니다 */
  function pokemonTypesFor(id) {
    id = Number(id) || 0;
    if (partnerData.pokemon && Number(partnerData.id) === id) return partnerData.pokemon.types || [];
    var e = monEntry(id, false);
    if (e && e.moveTypes && e.moveTypes.length) return e.moveTypes.slice();
    var off = offlinePokemon(id);
    if (off) return off.types || [];
    return [];
  }

  function spriteFor(id) {
    id = Number(id) || 0;
    if (partnerData.pokemon && Number(partnerData.id) === id && partnerData.pokemon.sprite) return partnerData.pokemon.sprite;
    var e = monEntry(id, false);
    if (e && e.sprite) return e.sprite;
    var off = offlinePokemon(id);
    if (off && off.sprite) return off.sprite;
    return SPRITE + id + '.png';
  }

  /* 기술 후보: 그 포켓몬다운 대표 기술 + PokeAPI 에서 받은 실제 기술 + 타입별 기술
     (인터넷이 없거나 기술 요청이 실패해도 앱 안의 목록으로 동작합니다) */
  function movePoolFor(id, types) {
    var out = [];
    var seen = {};
    function add(mv, type) {
      if (!mv || !mv.ko || seen[mv.ko]) return;
      if (!(Number(mv.power) > 0)) return;      // 변화 기술은 연출하지 않아요
      seen[mv.ko] = true;
      out.push({
        name: mv.name, ko: mv.ko, type: mv.type || type || 'normal',
        power: Number(mv.power), cls: mv.cls || 'physical'
      });
    }
    (SIGNATURE_MOVES[id] || []).forEach(function (mv) { add(mv, mv.type); });
    var e = monEntry(id, false);
    if (e && Array.isArray(e.movePool)) e.movePool.forEach(function (mv) { add(mv, mv.type); });
    (types && types.length ? types : ['normal']).forEach(function (t) {
      (MOVE_LIB[t] || []).forEach(function (mv) { add(mv, t); });
    });
    if (!out.length) (MOVE_LIB.normal || []).forEach(function (mv) { add(mv, 'normal'); });
    return out;
  }

  /* PokeAPI 의 그 포켓몬 실제 기술 목록(moves[])을 한글 이름·타입·위력까지 받아 둡니다.
     화면은 기다리지 않고, 받은 뒤에 계획을 그 기술들로 다시 만듭니다. */
  var movePoolJobs = {};
  function prefetchMovePool(p) {
    var id = Number(p && p.id) || 0;
    if (!id) return Promise.resolve(null);
    var e = monEntry(id, false);
    if (!e) return Promise.resolve(null);
    if (Array.isArray(e.movePool) && e.movePool.length) return Promise.resolve(e.movePool);
    if (movePoolJobs[id]) return movePoolJobs[id];
    var names = [];
    (p.moves || []).slice(0, 10).forEach(function (m) {
      if (m && m.name && names.indexOf(m.name) < 0) names.push(m.name);
    });
    (SIGNATURE_MOVES[id] || []).forEach(function (m) {
      if (m && m.name && names.indexOf(m.name) < 0) names.push(m.name);
    });
    if (!names.length) return Promise.resolve(null);
    var got = [];
    var job = Promise.all(names.map(function (nm) {
      return getMove(nm).then(function (mv) {
        if (!mv || !mv.type || !(Number(mv.power) > 0)) return null;
        got.push({ name: mv.name || nm, ko: mv.nameKo, type: mv.type, power: Number(mv.power), cls: mv.damageClass || 'physical' });
        return null;
      }).catch(function () { return null; });
    })).then(function () {
      if (got.length && e && typeof e === 'object') {
        e.movePool = got;
        // 아직 기술을 하나도 배우기 전이고, 앱이 만든 계획이면 실제 기술 목록으로 다시 만듭니다
        if ((!Array.isArray(e.movePlan) || !e.movePlan.length || e.movePlanFrom === 'auto') &&
          (!Array.isArray(e.learnedMoves) || !e.learnedMoves.length)) {
          e.movePlan = null;
          e.movePlanFrom = '';
          ensureMovePlan(id, pokemonTypesFor(id));
        }
        save();
      }
      delete movePoolJobs[id];
      return got.length ? got : null;
    }).catch(function () {
      delete movePoolJobs[id];
      return null;
    });
    movePoolJobs[id] = job;
    return job;
  }

  function moveShuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* 기술 계획 — 레벨 간격은 항상 2 이상(한 레벨은 꼭 건넌다) */
  function buildMovePlan(pool, id) {
    var sig = (SIGNATURE_MOVES[id] || []).filter(function (mv) { return Number(mv.power) > 0; });
    var sigNames = {};
    sig.forEach(function (mv) { sigNames[mv.ko] = true; });
    var rest = pool.filter(function (mv) { return !sigNames[mv.ko]; });
    var queue = sig.slice();
    var bag = moveShuffle(rest.length ? rest : pool);
    var plan = [];
    var lv = MOVE_LEARN_START_LEVEL;
    while (lv <= MOVE_PLAN_END_LEVEL && plan.length < MOVE_PLAN_MAX) {
      if (!queue.length && !bag.length) break;      // 같은 기술을 두 번 배우지 않아요
      var mv = queue.length ? queue.shift() : bag.shift();
      if (!mv) break;
      plan.push({ lv: lv, move: mv });
      // 2·3·4 중 하나 — 어떤 경우에도 바로 다음 레벨은 건넙니다
      lv += MOVE_LEARN_GAP_MIN + Math.floor(Math.random() * 3);
    }
    return plan;
  }

  function learnedRecord(move, lv, at) {
    return {
      name: move.name, ko: move.ko, type: move.type, power: move.power, cls: move.cls,
      lv: Number(lv) || 1, at: at === undefined ? todayKey() : at
    };
  }

  /* 계획이 없으면 지금 만든다. 이미 지난 레벨의 기술은 조용하며 '배운 기술'에 넣어 둡니다. */
  function ensureMovePlan(id, types) {
    id = Number(id) || 0;
    if (!id) return null;
    var e = monEntry(id, false);
    if (!e) return null;
    var provided = (types && types.length) ? types.slice() : null;
    if (provided) e.moveTypes = provided;
    if (Array.isArray(e.movePlan) && e.movePlan.length) return e.movePlan;
    var useTypes = provided || (e.moveTypes || []);
    if (!useTypes.length) {
      var off = offlinePokemon(id);
      if (off) useTypes = off.types || [];
    }
    if (!useTypes.length && partnerData.pokemon && Number(partnerData.id) === id) {
      useTypes = partnerData.pokemon.types || [];
    }
    if (useTypes.length) e.moveTypes = useTypes.slice();
    var plan = buildMovePlan(movePoolFor(id, useTypes), id);
    e.movePlan = plan;
    e.movePlanFrom = 'auto';
    if (!Array.isArray(e.learnedMoves)) e.learnedMoves = [];
    if (!e.learnedMoves.length) {
      var level = Math.max(1, Number(e.level) || 1);
      plan.forEach(function (slot) {
        if (Number(slot.lv) > level) return;
        e.learnedMoves.push(learnedRecord(slot.move, slot.lv, ''));
      });
    }
    return plan;
  }

  /* 레벨이 올랐을 때 그 레벨에 배우기로 한 기술이 있는지 */
  function learnMoveForLevel(mon, level, nameKo) {
    if (!mon) return null;
    var plan = mon.movePlan || [];
    var slot = null;
    for (var i = 0; i < plan.length; i++) {
      if (Number(plan[i].lv) === Number(level)) { slot = plan[i]; break; }
    }
    if (!slot) return null;
    if (!Array.isArray(mon.learnedMoves)) mon.learnedMoves = [];
    for (var j = 0; j < mon.learnedMoves.length; j++) {
      if (Number(mon.learnedMoves[j].lv) === Number(level)) return null;   // 이미 배운 레벨
    }
    var rec = learnedRecord(slot.move, level);
    mon.learnedMoves.push(rec);
    if (mon.learnedMoves.length > MOVE_LEARNED_MAX) {
      mon.learnedMoves = mon.learnedMoves.slice(-MOVE_LEARNED_MAX);
    }
    return {
      monId: mon.id, nameKo: nameKo || monDisplayName(mon.id),
      level: Number(level), move: rec
    };
  }

  /* ---- 연출 대기열: 레벨업 토스트가 끝난 뒤에 기술 팝업을 띄웁니다 ---- */
  var moveLearnQueue = [];
  var moveLearnTimer = null;
  var moveStageCurrent = null;

  function queueMoveLearn(list) {
    (list || []).forEach(function (item) { moveLearnQueue.push(item); });
    if (moveStageCurrent) return;              // 지금 연출 중이면 닫은 뒤에 이어서
    scheduleMoveLearnStage(950);
  }

  function scheduleMoveLearnStage(ms) {
    if (moveLearnTimer) { clearTimeout(moveLearnTimer); moveLearnTimer = null; }
    if (!moveLearnQueue.length) return;
    moveLearnTimer = setTimeout(function () {
      moveLearnTimer = null;
      if (moveStageCurrent) return;
      var item = moveLearnQueue.shift();
      if (!item) return;
      showMoveShowcase({
        monId: item.monId, nameKo: item.nameKo, move: item.move,
        level: item.level, learned: true
      });
    }, ms == null ? 950 : ms);
  }

  /* 한국어 조사 고르기 — '그란돈이', '피카츄가', '단애의칼을', '몸통박치기를' */
  function hasBatchim(s) {
    var t = String(s == null ? '' : s).replace(/[)\]}」』\s]+$/, '');
    if (!t) return false;
    var ch = t.charCodeAt(t.length - 1);
    if (isNaN(ch) || ch < 0xAC00 || ch > 0xD7A3) return false;
    return ((ch - 0xAC00) % 28) !== 0;
  }
  function josaI(name) { return hasBatchim(name) ? '이' : '가'; }
  function josaEul(name) { return hasBatchim(name) ? '을' : '를'; }

  /* ---- 타입별 효과음 (Web Audio 로 직접 만듭니다) ---- */
  var MOVE_TONE = {
    normal: 320, fire: 220, water: 300, electric: 660, grass: 440, ice: 560,
    fighting: 170, poison: 240, ground: 120, flying: 500, psychic: 720, bug: 400,
    rock: 110, ghost: 200, dragon: 160, dark: 150, steel: 340, fairy: 780
  };
  function sweep(f0, f1, start, dur, type, vol) {
    var ac = audioCtx();
    if (!ac) return;
    try {
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.type = type || 'sawtooth';
      var t0 = ac.currentTime + (start || 0);
      if (o.frequency.setValueAtTime) o.frequency.setValueAtTime(f0, t0);
      if (o.frequency.exponentialRampToValueAtTime) {
        o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
      }
      o.connect(g);
      g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.start(t0);
      o.stop(t0 + dur + 0.03);
    } catch (e) { /* ignore */ }
  }
  function sndMoveUse(type) {
    var base = MOVE_TONE[type] || 300;
    for (var i = 0; i < 4; i++) {
      tone(base * (1 + i * 0.5), i * 0.07, 0.14, 'triangle', 0.08);       // 기운을 모으는 소리
    }
    sweep(base * 5, base * 0.6, 0.34, 0.42, type === 'electric' ? 'square' : 'sawtooth', 0.2);
    tone(base * 2, 0.36, 0.32, 'triangle', 0.1);                            // 내려치는 소리
    if (type === 'electric') {
      tone(1200, 0.4, 0.1, 'square', 0.07);
      tone(900, 0.52, 0.1, 'square', 0.06);
    }
    if (type === 'ground' || type === 'rock') sweep(90, 40, 0.36, 0.5, 'sine', 0.22);
  }

  /* ---- 타입별 효과 조각 (쉬어가며 다시 뿌립니다) ---- */
  function moveFxHtml() {
    var html = '';
    for (var i = 0; i < 20; i++) {
      var ang = Math.round(i * 18 + (Math.random() * 16 - 8));
      var dist = 110 + Math.round(Math.random() * 150);
      var dl = Math.round(Math.random() * 5) / 10;
      var sz = 6 + Math.round(Math.random() * 10);
      html += '<i class="mv-p" style="--a:' + ang + 'deg;--d:' + dist + 'px;--dl:' + dl + 's;--sz:' + sz + 'px"></i>';
    }
    html += '<i class="mv-ring"></i><i class="mv-ring r2"></i>' +
      '<i class="mv-bolt b1"></i><i class="mv-bolt b2"></i>' +
      '<i class="mv-beam"></i><i class="mv-flash"></i>';
    return html;
  }

  /* ---- 기술 연출 팝업 ---- */
  function showMoveShowcase(opts) {
    var stage = $('moveStage');
    if (!stage) return;
    var o = opts || {};
    var mv = o.move || {};
    var type = mv.type || 'normal';
    var info = TYPE_FX[type] || TYPE_FX.normal;
    var color = TYPE_COLOR[type] || '#f7d02c';
    var nameKo = o.nameKo || monDisplayName(o.monId);
    var lv = Number(o.level) || monLevel(o.monId);
    var power = Number(mv.power) > 0 ? mv.power : null;
    var clsKo = mv.cls === 'physical' ? '물리' : (mv.cls === 'special' ? '특수' : '');

    moveStageCurrent = { monId: o.monId, move: mv, level: lv, learned: !!o.learned };

    stage.setAttribute('data-type', type);
    stage.setAttribute('data-fx', info.fx);
    stage.style.setProperty('--mv', color);
    stage.innerHTML =
      '<div class="mv-bg"></div>' +
      '<div class="mv-fx">' + moveFxHtml() + '</div>' +
      '<div class="mv-card">' +
        '<div class="mv-badge">🎉 Lv.' + lv + ' 달성! 새로운 기술을 배웠어요!</div>' +
        '<div class="mv-mon-wrap">' +
          '<div class="mv-aura"></div>' +
          '<img class="mv-mon" src="' + esc(spriteFor(o.monId)) + '" alt="' + esc(nameKo) + '">' +
        '</div>' +
        '<div class="mv-move" style="--mv:' + color + '">' +
          '<div class="mv-move-head">' +
            '<span class="tbadge" style="background:' + color + '">' + esc(TYPE_KO[type] || type) + '</span>' +
            '<span class="mv-name">' + esc(mv.ko || mv.name || '기술') + '</span>' +
            '<span class="mv-power">위력 ' + (power == null ? '—' : power) + (clsKo ? ' · ' + clsKo : '') + '</span>' +
          '</div>' +
          '<div class="mv-line">' + info.e + ' ' + esc(nameKo) + josaI(nameKo) +
            ' 「' + esc(mv.ko || mv.name || '기술') + '」' + josaEul(mv.ko || mv.name) + ' 사용했다!</div>' +
        '</div>' +
        '<div class="mv-btns">' +
          '<button class="btn mv-replay" type="button" data-mact="replay">⚡ 다시 써 보기</button>' +
          '<button class="btn primary mv-ok" type="button" data-mact="close">멋지다! 확인</button>' +
        '</div>' +
      '</div>';
    stage.classList.add('open');
    stage.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    playMoveStage();
  }

  function playMoveStage() {
    var stage = $('moveStage');
    if (!stage || !stage.classList.contains('open')) return;
    var card = stage.querySelector('.mv-card');
    stage.classList.remove('play');
    if (card) card.style.animation = 'none';
    void stage.offsetWidth;                  // 애니메이션을 처음부터 다시
    if (card) card.style.animation = '';
    stage.classList.add('play');
    sndMoveUse((moveStageCurrent && moveStageCurrent.move && moveStageCurrent.move.type) || 'normal');
  }

  function replayMoveShowcase() {
    var stage = $('moveStage');
    if (!stage || !stage.classList.contains('open')) return;
    var fxLayer = stage.querySelector('.mv-fx');
    if (fxLayer) fxLayer.innerHTML = moveFxHtml();     // 효과를 새 자리에서 다시
    playMoveStage();
  }

  function closeMoveShowcase() {
    var stage = $('moveStage');
    moveStageCurrent = null;
    if (stage) {
      stage.classList.remove('open', 'play');
      stage.setAttribute('aria-hidden', 'true');
      stage.innerHTML = '';
      stage.removeAttribute('data-type');
      stage.removeAttribute('data-fx');
    }
    // 도감 상세가 뒤에 열려 있으면 스크롤 잠금은 그대로 둡니다
    var root = $('modalRoot');
    document.body.style.overflow = (root && root.classList.contains('open')) ? 'hidden' : '';
    if (moveLearnQueue.length) scheduleMoveLearnStage(420);   // 다음 기술이 남았으면 이어서
  }

  /* 도감 상세의 '배운 기술' — 누르면 같은 연출을 다시 봅니다 */
  function learnedMovesHtml(id) {
    var e = monEntry(id, false);
    var list = (e && Array.isArray(e.learnedMoves)) ? e.learnedMoves : [];
    if (!list.length) return '';
    var chips = list.map(function (mv, i) {
      var color = TYPE_COLOR[mv.type] || '#999';
      return '<button class="learned-chip" type="button" data-act="move-showcase" data-id="' + Number(id) +
        '" data-idx="' + i + '">' +
        '<span class="lc-dot" style="background:' + color + '"></span>' +
        '<span class="lc-name">' + esc(mv.ko || mv.name) + '</span>' +
        '<span class="lc-lv">Lv.' + (Number(mv.lv) || '?') + '</span>' +
        '</button>';
    }).join('');
    return '<div class="learned-wrap"><div class="moves-title">🎓 배운 기술 ' +
      '<span style="font-size:13px;color:#5d5a66;font-weight:400">(눌러서 기술 연출 다시 보기)</span></div>' +
      '<div class="learned-chips">' + chips + '</div></div>';
  }

  function showLearnedMove(id, idx) {
    var e = monEntry(Number(id), false);
    if (!e || !Array.isArray(e.learnedMoves)) return;
    var mv = e.learnedMoves[Number(idx)];
    if (!mv) return;
    showMoveShowcase({
      monId: Number(id), nameKo: monDisplayName(id), move: mv,
      level: mv.lv, learned: false
    });
  }

  function dictSubmitQuery() {

    if (e) { openDictEntry(e); return; }

  /* ---- 인터넷 사전 (기본 낱말에 없을 때) ---- */
  function dictFetchJSON(url, ms) {
    if (typeof fetch !== 'function') return Promise.reject(new Error('no fetch'));
    var opts = { mode: 'cors' };
    var ctrl = null;
    if (typeof AbortController === 'function') {
      ctrl = new AbortController();
      opts.signal = ctrl.signal;
      setTimeout(function () { try { ctrl.abort(); } catch (e) { } }, ms || 7000);
    }
    return fetch(url, opts).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    });
  }
  function dictParseApi(data) {
    if (!data || !data.length || !data[0]) return null;
    var first = data[0] || {};
    var out = { word: String(first.word || ''), phonetic: '', defs: [], audioUS: '', audioUK: '', audioAny: '' };
    (first.phonetics || []).forEach(function (p) {
      if (!p) return;
      if (!out.phonetic && p.text) out.phonetic = String(p.text);
      if (p.audio) {
        var a = String(p.audio);
        if (a.indexOf('http') !== 0) a = 'https:' + (a.indexOf('//') === 0 ? '' : '//') + a;
        var low = a.toLowerCase();
        if (!out.audioUS && (low.indexOf('-us') >= 0 || low.indexOf('_us') >= 0)) out.audioUS = a;
        if (!out.audioUK && (low.indexOf('-uk') >= 0 || low.indexOf('_uk') >= 0)) out.audioUK = a;
        if (!out.audioAny) out.audioAny = a;
      }
    });
    if (!out.audioUS && out.audioAny) out.audioUS = out.audioAny;
    (first.meanings || []).forEach(function (m) {
      if (!m || out.defs.length >= 3) return;
      var d = m.definitions && m.definitions[0];
      if (!d || !d.definition) return;
      out.defs.push({ pos: String(m.partOfSpeech || ''), def: String(d.definition), ex: String(d.example || '') });
    });
    if (!out.defs.length && !out.phonetic && !out.audioAny) return null;
    return out;
  }
  function dictParseTransl(data, word) {
    if (!data) return '';
    if (data.responseStatus && Number(data.responseStatus) !== 200) return '';
    var t = data.responseData && data.responseData.translatedText;
    if (!t) return '';
    t = String(t)
      .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').trim();
    if (!t || /MYMEMORY WARNING/i.test(t)) return '';
    if (dictNorm(t) === dictNorm(word)) return '';
    return t.length > 80 ? t.slice(0, 80) + '…' : t;
  }
  function dictSaveCache() {
    var keys = Object.keys(dictCache);
    while (keys.length > 200) delete dictCache[keys.shift()];
    writeJSON(DICT_CACHE_KEY, dictCache);
  }
  function dictLoadOnline(q) {
    var word = dictNorm(q) || String(q || '').trim().toLowerCase();
    if (!word) return;
    var cached = dictCache[word];
    if (cached) { openDictEntry(cached); return; }
    dictStopRec();
    dictStopAudio();
    var placeholder = { word: word, ko: '', phonetic: '', emoji: '🌐', builtin: false, online: true, pending: true, defs: [] };
    dictState.entry = placeholder;
    renderDictDetail();
    Promise.all([
      dictFetchJSON(DICT_API + encodeURIComponent(word), 8000).then(dictParseApi).catch(function () { return null; }),
      dictFetchJSON(DICT_TRANS + '?q=' + encodeURIComponent(word) + '&langpair=' + encodeURIComponent('en|ko'), 7000)
        .then(function (d) { return dictParseTransl(d, word); }).catch(function () { return ''; })
    ]).then(function (res) {
      if (!dictState.entry || dictState.entry.word !== word || !dictState.entry.pending) return;
      var api = res[0], ko = res[1];
      if (!api && !ko) {
        dictState.entry = {
          word: word, ko: '', phonetic: '', emoji: '🌐', builtin: false, online: true,
          pending: false, failed: true, defs: []
        };
        renderDictDetail();
        toast('인터넷에서 뜻을 찾지 못했어요. 철자를 확인해 보세요!');
        return;
      }
      var entry = api || { word: word, phonetic: '', defs: [], audioUS: '', audioUK: '' };
      entry.word = entry.word || word;
      entry.builtin = false;
      entry.online = true;
      entry.pending = false;
      entry.failed = false;
      entry.emoji = '🌐';
      entry.ko = ko || '';
      dictCache[word] = entry;
      dictSaveCache();
      dictState.entry = entry;
      renderDictDetail();
    });
  }

  /* ---- 사전 안 버튼 처리 ---- */
  function dictHandleAct(el) {
    var act = el.getAttribute('data-dact');
    var entry = dictState.entry;
    if (act === 'cat') {
      dictState.cat = el.getAttribute('data-cat') || 'all';
      dictState.query = '';
      var inp = $('dictQuery');
      if (inp) inp.value = '';
      paintDictResults();
      return;
    }
    if (act === 'clear') {
      dictState.query = '';
      var inp2 = $('dictQuery');
      if (inp2) { inp2.value = ''; inp2.focus(); }
      paintDictResults();
      return;
    }
    if (act === 'random') {
      if (!DICT_WORDS.length) return;
      openDictEntry(DICT_WORDS[Math.floor(Math.random() * DICT_WORDS.length)]);
      return;
    }
    if (act === 'word') {
      var w = el.getAttribute('data-word') || '';
      var e = DICT_BY_WORD[w.toLowerCase()] || dictCache[dictNorm(w)];
      if (e) openDictEntry(e);
      return;
    }
    if (act === 'online') { dictLoadOnline(el.getAttribute('data-q') || ''); return; }
    if (act === 'back') {
      dictStopRec();
      dictStopAudio();
      dictState.entry = null;
      renderDictHome(true);
      return;
    }
    if (act === 'say') {
      if (!entry) return;
      dictSpeak(entry.word, el.getAttribute('data-lang') || 'en-US', Number(el.getAttribute('data-rate')) || 1);
      return;
    }
    if (act === 'example') {
      if (!entry || !entry.ex) return;
      dictSpeak(entry.ex, 'en-US', 0.85);
      return;
    }
    if (act === 'native') {
      if (!entry) return;
      dictPlayNative(el.getAttribute('data-url'), entry.word, el.getAttribute('data-lang') || 'en-US');
      return;
    }
    if (act === 'record') { dictStartRecord(); return; }
    if (act === 'stop') { dictStopRec(); dictStopUI(); return; }
    if (act === 'replay') { dictPlayReplay(); return; }
  }
  function dictCleanup() {

  var HANGUL_XP = 10;                 // 한 판을 끝내면 주는 XP

  /* 오늘의 공부놀이 기록 — 날이 바뀌면 판 수·보상을 새로 시작해요.

  function hangulDay() {
    var t = todayKey();
    if (!S.hangul || typeof S.hangul !== 'object') {
      S.hangul = {
        date: t, todayRounds: 0, rewarded: 0, totalRounds: 0,
        byMode: { dictation: 0, math: 0, english: 0 }, progress: null
      };
    }
    var h = S.hangul;
    if (h.date !== t) {
      h.date = t;
      h.todayRounds = 0;
      h.rewarded = 0;
      h.byMode = { dictation: 0, math: 0, english: 0 };
      h.progress = null;
    }
    if (!h.byMode || typeof h.byMode !== 'object') h.byMode = {};
    var sum = 0;
    HANGUL_MODE_ORDER.forEach(function (id) {
      var v = Number(h.byMode[id]);
      if (!isFinite(v) || v < 0) v = 0;
      h.byMode[id] = Math.floor(v);
      sum += h.byMode[id];
    });
    h.todayRounds = sum;
    h.rewarded = Math.max(0, Number(h.rewarded) || 0);
    h.totalRounds = Math.max(0, Number(h.totalRounds) || 0);
    if (!h.progress || typeof h.progress !== 'object') h.progress = null;
    return h;
  }

  /* 놀이마다 하루에 할 수 있는 판 수 (부모 설정). 0이면 오늘은 잠금 */
  function hangulLimit() {
    var v = Number(S.settings && S.settings.hangulDailyLimit);

  }

  function hangulModeLeft(mode) {
    var lim = hangulLimit();
    if (lim <= 0) return 0;
    var h = hangulDay();
    return Math.max(0, lim - (h.byMode[mode] || 0));
  }

  function hangulModeLocked(mode) {
    return hangulModeLeft(mode) <= 0;
  }

  function hangulLeftTotal() {
    var left = 0;
    HANGUL_MODE_ORDER.forEach(function (id) { left += hangulModeLeft(id); });

  function hangulDayCap() {
    return hangulLimit() * HANGUL_MODE_ORDER.length;

  function hangulRewardCap() {
    var lim = hangulLimit();
    return lim <= 0 ? 0 : lim * HANGUL_MODE_ORDER.length;
  }
